<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test: AXA-App öffnen</title>
<style>body{font:16px system-ui,sans-serif;margin:20px;color:#14213d}a{display:block;margin:12px 0;padding:14px;border-radius:10px;background:#163a6b;color:#fff;text-decoration:none;font-weight:600}
p{margin:6px 0}#r{padding:10px;border-radius:8px;background:#fde8e8;color:#8a1c1c;display:none}</style></head>
<body>
<h2>Test: AXA-App direkt öffnen</h2>
<p>Bitte jeden Button einzeln antippen. Danach zurück hierher und notieren, welcher die AXA-App direkt geöffnet hat.</p>
<div id="r"></div>
<script>
const fb=n=>encodeURIComponent(location.href.split("#")[0]+"#fehler-"+n);
const V=[
 ["1","https://myaxa.de/"],
 ["2","https://www.myaxa.de/"],
 ["3","intent://#Intent;package=de.axa.noa;S.browser_fallback_url="+fb(3)+";end"],
 ["4","intent://myaxa.de/#Intent;scheme=https;package=de.axa.noa;S.browser_fallback_url="+fb(4)+";end"],
 ["5","intent://entry.axa.de/kunde/myaxa/#Intent;scheme=https;package=de.axa.noa;S.browser_fallback_url="+fb(5)+";end"],
 ["6","intent://#Intent;scheme=myaxa;package=de.axa.noa;S.browser_fallback_url="+fb(6)+";end"]
];
document.write(V.map(([n,u])=>`<a href="${u}">Variante ${n}</a>`).join(""));
function show(){const m=location.hash.match(/fehler-(\d)/);const r=document.getElementById("r");if(m){r.style.display="block";r.textContent="Variante "+m[1]+": hat nicht funktioniert."}}
show();addEventListener("hashchange",show);
</script>
<p>Variante 1 und 2: Öffnet sich die Webseite statt der App, hat es nicht funktioniert.</p>
</body></html>
