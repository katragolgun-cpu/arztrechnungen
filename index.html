<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: mobile-first ledger — summary tiles, filter chips, stack of bill cards with stamp-style status marks; bottom sheet: short view first, details on demand */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e8ecf0; --line:#d5dce3;
  --ink:#16222e; --muted:#5b6b7a;
  --accent:#163a6b; --accent-ink:#ffffff;
  --ok:#1f7a45; --ok-soft:#dcefe3;
  --warn:#9a5b00; --warn-soft:#f7ead2;
  --bad:#b0322b; --bad-soft:#f6dedc;
  --wait:#3e5a9a; --wait-soft:#dfe6f5;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SFMono-Regular",Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --surface:#172129; --sunken:#1e2a34; --line:#2b3a46;
  --ink:#e6edf2; --muted:#93a4b3; --accent:#7fb2e8; --accent-ink:#0b1f3a;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e2a54a; --warn-soft:#3a2c14;
  --bad:#f0827a; --bad-soft:#3d1d1b; --wait:#8fa9e6; --wait-soft:#1e2a45; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;margin:0;font-weight:700}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;font:inherit;color:inherit}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .val{font-family:var(--f-num);font-size:20px;font-weight:600}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile.hot .val,.tile.cut .val{color:var(--bad)} .tile.wait .val{color:var(--wait)} .tile.todo .val{color:var(--warn)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.searchinfo{font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0;flex:1}
.row1 .tick+.who{margin-left:2px}
.prov{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.via{font-size:12.5px;color:var(--muted);margin-top:1px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.amt{font-family:var(--f-num);font-weight:600;font-size:16px;white-space:nowrap}
.pchip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--ink);margin-right:6px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor;line-height:1.3;white-space:nowrap}
.stamp b{font-family:var(--f-num);font-weight:600;letter-spacing:0;text-transform:none}
.s-ok{color:var(--ok);background:var(--ok-soft)} .s-todo{color:var(--warn);background:var(--warn-soft)}
.s-wait{color:var(--wait);background:var(--wait-soft)} .s-bad{color:var(--bad);background:var(--bad-soft)}
.s-na{color:var(--muted);background:var(--sunken);border-style:dashed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.guidecard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.guidecard .gl{font-size:14px;min-width:0}
.guidecard .gl b{display:block;font-size:15px;margin-bottom:2px}
.guidecard .gl span{color:var(--muted);font-size:13px}
.guidebar{position:sticky;top:0;z-index:2;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 12px;margin-top:10px}
.guidebar .gtop{font-size:13px;font-weight:600;opacity:.9}
.guidebar .gtxt{font-size:14px;margin:4px 0 8px}
.guidebar .btnrow{margin:0}
.guidebar .btn{background:rgba(255,255,255,.15);color:inherit;border-color:rgba(255,255,255,.35)}
.guidebar .btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.txtbox{margin-top:8px}
.txtbox textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--sunken);color:var(--ink);resize:vertical}
#splash{position:fixed;inset:0;z-index:100;background:#163a6b;overflow:hidden;transition:opacity .35s ease}
#splash img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .35s ease,transform 1.2s ease-out}
#splash.on img{opacity:1;transform:scale(1)}
#splash.out{opacity:0}
@media (prefers-reduced-motion: reduce){#splash img{transform:none;transition:opacity .2s}}
.splashprev{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin:6px 0}
.grp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--sunken);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;text-align:left;padding:10px 12px;border-radius:12px;margin-top:4px}
.grp .chev{width:14px;color:var(--muted);font-size:11px}
.grp .gt{flex:1}
.grp .gs{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px}
.grp .ga{font-weight:600}
.year{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:50%;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:7}
.fab svg{width:28px;height:28px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.bnav button{position:relative;border:0;background:none;color:var(--ink);font:inherit;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;min-height:58px;border-radius:12px}
.bnav button .ic{display:flex;align-items:center;justify-content:center;width:54px;height:30px;border-radius:999px}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="true"]{color:var(--accent)}
.bnav button[aria-current="true"] .ic{background:var(--sunken)}
.bnav button.zero{color:var(--muted);opacity:.55}
.bnav button.zero[aria-current="true"]{opacity:1;color:var(--accent)}
.bnav .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.bnav button.zero .n{background:var(--sunken);color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn.sq{padding:8px 10px;display:flex;align-items:center}
.iconbtn.sq svg{width:20px;height:20px}
.iconbtn.sq[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-head{flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:18px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-num);font-size:28px;font-weight:600}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.line .t{font-weight:600}
.line .s{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input.num{font-family:var(--f-num)}
.calc{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--sunken);border-radius:9px;padding:8px 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.done{background:#1f7a45;color:#fff;border-color:#1f7a45;font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn[disabled]{opacity:.55}
.thumb{width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--sunken)}
.status{font-size:13.5px;color:var(--muted)} .status.err{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.checkline{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13.5px}
#btnSettings{position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font:inherit;color:inherit;text-align:left}
.sumbar .vals{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;min-width:0}
.sumbar .vals b{font-family:var(--f-num);font-weight:600}
.sumbar .pay b{color:var(--bad)} .sumbar .exp b{color:var(--wait)}
.sumbar .chev{color:var(--muted);font-size:13px;white-space:nowrap}
.summary-wrap{display:flex;flex-direction:column;gap:10px}
.sub-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:-4px}
.more summary{cursor:pointer;padding:2px 0}
.morelist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.morelist .btn{width:100%;text-align:left;justify-content:flex-start}
.nextstep .line{padding:6px 0}
.next{font-size:13.5px;font-weight:600}
.next.s-geld{color:var(--wait)} .next.s-einreichen{color:var(--warn)} .next.s-warten{color:var(--wait)} .next.s-ueberweisen{color:var(--accent)} .next.s-nachweis{color:var(--bad)}
.due{font-size:12.5px;color:var(--muted)} .due.warn{color:var(--warn);font-weight:600} .due.bad{color:var(--bad);font-weight:600}
.listtools{justify-content:flex-end}
.prooftools{flex-wrap:nowrap}.prooftools .btn{flex:1 1 0;min-width:0}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tick{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selinfo{font-size:13.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.pchk{display:flex;gap:10px;align-items:flex-start;min-width:0;font-size:14px}
.pchk input{width:20px;height:20px;flex:none;margin-top:2px}
.scanwrap{display:flex;justify-content:center;margin:12px 0}
.scanwrap canvas{touch-action:none;border-radius:8px;max-width:100%;background:#000}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumbs img{width:84px;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.paygrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px}
.paygrid .k{color:var(--muted);font-size:12.5px}
.paygrid .v{overflow-wrap:anywhere;font-family:var(--f-num)}
.inline{display:flex;gap:8px;align-items:end}
.inline label{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* ---- v20: modernere Optik, Personenbilder ---- */
:root{--r:16px;--shadow:0 1px 2px rgba(16,34,46,.06),0 4px 14px rgba(16,34,46,.06)}
@media (prefers-color-scheme: dark){:root{--shadow:0 1px 2px rgba(0,0,0,.4)}}
body{background:var(--bg)}
header.top h1{font-size:26px;letter-spacing:-.02em}
.card,.tile,.sumbar,.empty,.sec{border-color:transparent;box-shadow:var(--shadow)}
.card{padding:14px 16px;border-radius:var(--r);transition:transform .12s ease}
.card:active{transform:scale(.99)}
.sumbar{background:linear-gradient(135deg,#163a6b,#0e2748);color:#fff;padding:16px 18px;border-radius:20px}
@media (prefers-color-scheme: dark){.sumbar{background:linear-gradient(135deg,#0f4b55,#0a2f36)}}
.sumbar .vals{flex-direction:column;gap:2px;font-size:13px;opacity:.95}
.sumbar .vals>span{display:flex;align-items:baseline;gap:8px}
.sumbar .pay b{color:#fff;font-size:26px} .sumbar .exp b{color:#cfe0f5;font-size:15px}
.sumbar .chev{color:#cfe0f5}
.search input{border-radius:14px;border-color:transparent;box-shadow:var(--shadow);padding:12px 40px 12px 14px}
.chip{border-color:transparent;box-shadow:var(--shadow);padding:7px 14px}
.people{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 4px;justify-content:space-between}
.people::-webkit-scrollbar{display:none}
.pbtn{flex:none;border:0;background:none;padding:0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;width:58px}
.pbtn .av{width:50px;height:50px;border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 0 2px transparent;transition:box-shadow .15s}
.pbtn[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.pbtn span{font-size:12.5px;font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn[aria-pressed="true"] span{color:var(--accent)}
.av{display:block;flex:none}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.pchip{display:inline-flex;align-items:center;gap:5px;background:none;padding:0;font-size:12.5px;margin-right:8px;color:var(--ink)}
.pchip .av{width:22px;height:22px;border-radius:50%}
.avsel{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.avsel label{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
.avsel input{position:absolute;opacity:0;pointer-events:none}
.avsel .av{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px transparent}
.avsel input:checked+.av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* ---- Testversion 2 ---- */
.teststrip{background:#9a5b00;color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:6px 10px;border-radius:10px}
.bnav{grid-template-columns:repeat(3,1fr)}
.area-h{display:flex;align-items:center;gap:8px;margin-top:8px}
.area-h h2{font-size:17px;margin:0}
.area-h .cnt{font-family:var(--f-num);font-size:12px;font-weight:700;background:var(--sunken);border-radius:999px;padding:1px 8px;color:var(--muted)}
.area-h .btn.link{margin-left:auto}
.hint{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;background:var(--wait-soft);color:var(--wait);border:0;border-radius:var(--r);padding:10px 14px}
.bcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bmain{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;width:100%}
.next.s-klaeren{color:var(--bad)} .next.s-bescheid,.next.s-geld{color:var(--wait)} .next.s-bezahlen{color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.dot2{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.dot2.on{background:var(--ok-soft);color:var(--ok)}

/* ===== Material 3 Expressive (v85): wie die Dokumente-App, nur hell, Grundton aus Dunkelblau #163a6b =====
   Formen wechseln beim Antippen, Bewegung mit Federn (--spring räumlich, --spring-fast kleine Teile, --effects Farbe). */
:root{
  --primary:#2b5592; --on-primary:#ffffff;
  --primary-container:#d6e3ff; --on-primary-container:#001b3e;
  --secondary-container:#dae2f9; --on-secondary-container:#131c2b;
  --tertiary:#8b4f1d; --tertiary-container:#ffdcc4; --on-tertiary-container:#2f1400;
  --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#410002;
  --green:#1d6c3a; --green-container:#c3efcc; --on-green-container:#00210c;
  --surface-m3:#f9f9ff; --surface-lowest:#ffffff; --surface-low:#f3f3fa; --surface-mid:#ededf4; --surface-high:#e7e8ee; --surface-highest:#e2e2e9;
  --on-surface:#191c20; --on-surface-variant:#44474e; --outline:#74777f; --outline-variant:#c4c6cf;
  --inverse-surface:#2e3036; --inverse-on-surface:#f0f0f7; --inverse-primary:#a9c7ff;
  --bg:var(--surface-m3); --surface:var(--surface-lowest); --sunken:var(--surface-high); --line:var(--outline-variant);
  --ink:var(--on-surface); --muted:var(--on-surface-variant); --accent:var(--primary); --accent-ink:var(--on-primary);
  --ok:var(--green); --ok-soft:var(--green-container); --warn:var(--tertiary); --warn-soft:var(--tertiary-container);
  --bad:var(--error); --bad-soft:var(--error-container); --wait:var(--primary); --wait-soft:var(--primary-container);
  --f-ui:"Google Sans Flex","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:var(--f-ui);
  --r:24px; --r-sheet:32px; --shadow:none;
  --e1:0 1px 2px rgba(0,0,0,.12),0 1px 3px 1px rgba(0,0,0,.06);
  --e3:0 4px 8px 3px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.16);
  --spring:linear(0, 0.039, 0.134, 0.255, 0.383, 0.507, 0.619, 0.716, 0.796, 0.86, 0.91, 0.947, 0.973, 0.992, 1.003, 1.01, 1.014, 1.015, 1.015, 1.013, 1.012, 1.01, 1.008, 1.006, 1.005, 1.003, 1.002, 1.001, 1.001, 1, 1, 1, 1);
  --spring-fast:linear(0, 0.053, 0.182, 0.347, 0.52, 0.682, 0.819, 0.928, 1.006, 1.057, 1.085, 1.094, 1.092, 1.081, 1.065, 1.049, 1.033, 1.02, 1.009, 1.001, 0.995, 0.992, 0.991, 0.991, 0.992, 0.993, 0.995, 0.997, 0.998, 0.999, 1, 1, 1);
  --effects:linear(0, 0.067, 0.206, 0.359, 0.501, 0.62, 0.717, 0.792, 0.849, 0.891, 0.922, 0.945, 0.961, 0.973, 0.981, 0.987, 0.991, 0.994, 0.996, 0.997, 1);
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:var(--surface-m3);--surface:var(--surface-lowest);--sunken:var(--surface-high);--line:var(--outline-variant);--ink:var(--on-surface);--muted:var(--on-surface-variant);
  --accent:var(--primary);--accent-ink:var(--on-primary);--ok:var(--green);--ok-soft:var(--green-container);--warn:var(--tertiary);--warn-soft:var(--tertiary-container);
  --bad:var(--error);--bad-soft:var(--error-container);--wait:var(--primary);--wait-soft:var(--primary-container);--shadow:none;color-scheme:light}}
body{background:var(--surface-m3);color:var(--on-surface);font-family:var(--f-ui);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.wrap{gap:14px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:0}

/* Kopf: großer Titel wie eine Android-App, runde Symbolknöpfe */
header.top{padding:12px 0 4px}
header.top h1{font-size:32px;line-height:40px;font-weight:650;letter-spacing:-.015em}
header.top p{color:var(--on-surface-variant);font-size:14px;margin-top:2px}
.iconbtn,.iconbtn.sq{border:0;background:var(--surface-high);color:var(--on-surface-variant);border-radius:24px;width:48px;height:48px;padding:0;display:grid;place-items:center;box-shadow:none;
  transition:border-radius .45s var(--spring-fast),background .2s var(--effects)}
.iconbtn.sq svg{width:22px;height:22px}
.iconbtn:active{border-radius:14px;background:var(--surface-highest)}
.iconbtn.sq[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-radius:16px}
.dot{top:8px;right:8px;width:8px;height:8px;border:0;background:var(--error)}

/* Hinweis-Leiste, Hinweise */
.banner{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:var(--r);padding:12px 12px 12px 18px}
.banner .btn{background:var(--surface-lowest);border-color:transparent;color:var(--on-tertiary-container)}
.hint{background:var(--primary-container);color:var(--on-primary-container);border-radius:16px}
.checkline{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:12px}
.teststrip{background:var(--tertiary);border-radius:16px}

/* Suche als Pille */
.search input{height:56px;border:0;border-radius:28px;background:var(--surface-high);box-shadow:none;padding:0 48px 0 20px;color:var(--on-surface)}
.search input:focus{outline:none;background:var(--surface-highest)}
.search button{width:44px;height:44px;border-radius:50%;font-size:24px}

/* Chips (8px Ecken, ausgewählt mit Haken) */
.chip{height:32px;display:inline-flex;align-items:center;border:1px solid var(--outline-variant);background:transparent;color:var(--on-surface-variant);border-radius:8px;padding:0 12px;box-shadow:none;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}

/* Startseite: Kacheln in Tonfarben, Formwechsel beim Tippen */
.h-tiles{gap:10px}
.h-tile{border-radius:28px;padding:18px 20px;gap:4px;transition:border-radius .5s var(--spring-fast),transform .5s var(--spring-fast),background .2s var(--effects)}
.h-tile:active{border-radius:16px;transform:scale(.97)}
.h-tile .l{font-size:14px;font-weight:600}
.h-tile .v{font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.01em}
.h-tile .s{font-size:13px;opacity:.85}
.h-tile.mint{background:var(--primary-container);color:var(--on-primary-container)} .h-tile.mint .l,.h-tile.mint .s{color:var(--on-primary-container)}
.h-tile.sand{background:var(--tertiary-container);color:var(--on-tertiary-container)} .h-tile.sand .l,.h-tile.sand .s{color:var(--on-tertiary-container)}
.h-tile.mint{border-radius:28px 28px 28px 8px} .h-tile.sand{border-radius:28px 28px 8px 28px}
.h-tile.white{background:var(--surface-lowest)} .h-tile.white .v{font-size:22px;line-height:28px}
.h-tile.white .l,.h-tile.white .s{color:var(--on-surface-variant)}
.h-sec{gap:10px}
.h-sec>h2{font-size:20px;line-height:28px;font-weight:600;margin:8px 4px 0}
/* Aufgabenliste als Gruppe: außen große, innen kleine Ecken (M3 Expressive Listen) */
.h-box{background:transparent;padding:0;gap:3px;border-radius:0}
.h-task{background:var(--surface-lowest);border:0;border-radius:6px;padding:12px 12px 12px 14px;transition:border-radius .45s var(--spring-fast),background .2s var(--effects)}
.h-task:first-child{border-radius:24px 24px 6px 6px}
.h-task:last-child{border-radius:6px 6px 24px 24px}
.h-task:only-child{border-radius:24px}
.h-task:active{background:var(--surface-low)}
.h-task .t b{font-size:16px;font-weight:600}
.h-task .t span{font-size:13.5px;color:var(--on-surface-variant)}
.h-task .btn.ghost{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.ini{width:44px;height:44px;border-radius:16px;font-weight:600;font-size:16px}
.h-task:nth-child(4n+2) .ini{border-radius:22px 8px 22px 8px}
.h-task:nth-child(4n+3) .ini{border-radius:22px}
.h-task:nth-child(4n+4) .ini{border-radius:8px 22px 8px 22px}
.h-money{background:var(--surface-lowest);border-radius:28px;padding:20px;gap:14px}
.h-money .hd{font-size:16px} .h-money .hd b{font-size:20px;font-weight:650}
.h-bar{height:10px;border-radius:5px;background:transparent;gap:4px}
.h-bar i{border-radius:5px;background:var(--primary)} .h-bar i+i{background:var(--primary-container)}
.h-hi{background:var(--primary-container);color:var(--on-primary-container);border-radius:20px;padding:14px 16px}
.h-hi span{color:var(--on-primary-container);opacity:.85}
.h-line .a{color:var(--on-surface)}
.h-more{color:var(--primary);font-weight:600;padding:0 4px;border-radius:16px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}

/* Personen: Auswahl als Ring in Primärfarbe */
.pbtn .av{transition:box-shadow .3s var(--effects),border-radius .5s var(--spring-fast),transform .5s var(--spring-fast)}
.pbtn:active .av{transform:scale(.92)}
.pbtn[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--surface-m3),0 0 0 6px var(--primary)}
.pbtn span{font-weight:500}
.pbtn[aria-pressed="true"] span{color:var(--primary);font-weight:700}

/* Karten */
.card,.bcard,.tile,.sumbar,.sec,.guidecard{border:0;box-shadow:none}
.card{background:var(--surface-lowest);border-radius:var(--r);padding:14px 16px;transition:transform .5s var(--spring-fast),border-radius .5s var(--spring-fast),background .2s var(--effects)}
.card:active{transform:scale(.985);border-radius:16px;background:var(--surface-low)}
.card.selected{background:var(--secondary-container);border-radius:16px;box-shadow:none}
.bcard{background:var(--surface-lowest);border-radius:var(--r)}
.prov{font-weight:650;font-size:16px}
.amt{font-family:var(--f-ui);font-weight:650;font-size:16px}
.tile{background:var(--surface-lowest);border-radius:var(--r)}
.tile .lbl{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.tile .val{font-family:var(--f-ui)}
.guidecard{background:var(--primary-container);color:var(--on-primary-container);border-radius:28px;padding:14px 14px 14px 20px}
.guidecard .gl span{color:var(--on-primary-container);opacity:.85}
.guidebar{background:var(--primary);border-radius:24px;padding:12px 16px}
.empty{background:var(--surface-low);border:0;border-radius:var(--r);color:var(--on-surface-variant)}
.sumbar{background:var(--primary);color:var(--on-primary);border-radius:28px}
.sumbar .pay b{color:#fff} .sumbar .exp b{color:var(--primary-container)} .sumbar .chev{color:var(--inverse-primary)}

/* Status-Marken: tonale Flächen statt Stempel-Rahmen */
.stamp{border:0;border-radius:8px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;padding:4px 10px}
.stamp b{font-family:var(--f-ui)}
.s-ok{color:var(--on-green-container);background:var(--green-container)} .s-todo{color:var(--on-tertiary-container);background:var(--tertiary-container)}
.s-wait{color:var(--on-primary-container);background:var(--primary-container)} .s-bad{color:var(--on-error-container);background:var(--error-container)}
.s-na{color:var(--on-surface-variant);background:var(--surface-high);border:0}
.dot2{background:var(--surface-high);color:var(--on-surface-variant);border-radius:8px;padding:3px 10px}
.dot2.on{background:var(--green-container);color:var(--on-green-container)}
.tick{border-radius:50%;border-color:var(--outline)}
.card.selected .tick{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* Gruppen (aufklappbar) */
.grp{background:var(--surface-mid);color:var(--on-surface);border-radius:16px;padding:12px 16px;font-size:15px;font-weight:500;transition:border-radius .45s var(--spring-fast)}
.grp[aria-expanded="true"]{border-radius:20px}
.grp:active{border-radius:10px}
.grp .gs{color:var(--on-surface-variant)}
.year{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;margin:10px 4px 0}
.area-h h2{font-size:20px;font-weight:600}
.area-h .cnt{font-family:var(--f-ui);background:var(--secondary-container);color:var(--on-secondary-container);border-radius:10px}

/* Knöpfe als Pillen; beim Drücken werden die Ecken kleiner */
.btn{min-height:40px;border:1px solid var(--outline);background:transparent;color:var(--primary);border-radius:20px;padding:0 18px;font-size:14px;font-weight:600;
  transition:border-radius .45s var(--spring-fast),background .2s var(--effects)}
.btn:active{border-radius:10px;background:rgba(43,85,146,.1)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:active{background:#234a82}
.btn.done{background:var(--green);border-color:var(--green)}
.btn.danger{color:var(--error);border-color:var(--error)}
.btn.link{border:0;background:none;color:var(--primary);padding:0 8px;min-height:36px}
.btn.link.inl{padding:0;min-height:0}
.btn[disabled]{opacity:.45}

/* Unterer Rand: Navigationsleiste mit Pillen-Anzeige, darüber erweiterter FAB */
.bnav{background:var(--surface-mid);border-top:0;backdrop-filter:none;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.bnav button{color:var(--on-surface-variant);font-size:12.5px;font-weight:600;gap:4px;min-height:64px;padding:0 2px}
.bnav button .ic{width:56px;height:32px;border-radius:16px;transition:background .25s var(--effects),width .5s var(--spring)}
.bnav button[aria-current="true"]{color:var(--on-surface)}
.bnav button[aria-current="true"] .ic{background:var(--secondary-container);color:var(--on-secondary-container);width:64px}
.bnav button svg{width:24px;height:24px}
.bnav button.zero{opacity:1;color:var(--on-surface-variant)}
.bnav button.zero[aria-current="true"]{color:var(--on-surface)}
.bnav .n{top:-2px;left:calc(50% + 8px);background:var(--error);color:#fff;font-family:var(--f-ui);font-size:11px;font-weight:600;height:16px;min-width:16px;line-height:16px;padding:0 4px;border-radius:8px}
.bnav button.zero .n{background:var(--surface-high);color:var(--on-surface-variant)}
.fab{left:auto;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));transform:none;bottom:calc(108px + env(safe-area-inset-bottom,0px));height:64px;padding:0 22px 0 20px;gap:12px;border-radius:20px;
  background:var(--primary-container);color:var(--on-primary-container);box-shadow:var(--e3);font:600 16px var(--f-ui);transition:border-radius .5s var(--spring-fast),transform .5s var(--spring-fast)}
.fab svg{width:24px;height:24px}
.fab:active{border-radius:32px;transform:scale(.96)}

<script>
"use strict";
/* =====================================================================
   PKV & Beihilfe – Testversion 2
   Aufbau nach dem echten Ablauf:
   1 Brief kommt · 2 erfassen · 3 einreichen · 4 auf Bescheid warten · 5 Bescheid abgleichen
   6 auf Geld warten · 7 Geld da kennzeichnen · 8 Arzt bezahlen · 9 erledigt
   Oberfläche: Zu tun (meine Aufgaben) · Läuft (warten auf andere) · Archiv (fertig, zum Nachschlagen)
   Eigene Daten: eigener Speicher auf dem Gerät, eigener Drive-Ordner. Die echte App bleibt unberührt.
   ===================================================================== */
// Gleiche Datei für Test (/v2/) und produktiv (Hauptadresse). Test: eigene Daten; produktiv: echte Daten im Ordner „Arztrechnungen“.
const PROD=!/\/v2\//.test(location.pathname);
const V2=PROD?"p2_":"v2_";
const LS={get(k){try{return localStorage.getItem(V2+k)}catch{return null}},set(k,v){try{localStorage.setItem(V2+k,v)}catch{}},del(k){try{localStorage.removeItem(V2+k)}catch{}}};

/* ================= Speicher (IndexedDB, eigene Datenbank der Testversion) ================= */
const DB_NAME=PROD?"pkv-beihilfe":"pkv-beihilfe-v2",DB_VER=1;
let _db;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const d=r.result;for(const [n,k] of [["invoices","id"],["bescheide","id"],["files","id"],["meta","key"]])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:k})};
    r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error);
  });
}
async function tx(store,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;
    const r=fn(s);if(r&&"onsuccess" in r)r.onsuccess=()=>out=r.result;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
}
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbGet=(s,k)=>tx(s,"readonly",st=>st.get(k));
const dbPut=(s,v)=>tx(s,"readwrite",st=>st.put(v));
const dbDel=(s,k)=>tx(s,"readwrite",st=>st.delete(k));
const dbClear=s=>tx(s,"readwrite",st=>st.clear());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= Zustand ================= */
const DEFAULT_SETTINGS={
  people:[{name:"Olgun",group:"A"},{name:"Pinar",group:"E"},{name:"Ikra",group:"K"},{name:"Hamza",group:"K"}],
  rates:{A:{pkv:0.3,bh:0.7},E:{pkv:0.3,bh:0.7},K:{pkv:0.2,bh:0.8}},
  payDays:30,warnDays:7
};
const GROUPS={A:"Antragsteller",E:"Ehepartner",K:"Kind"};
const SIDES=[["pkv","AXA"],["bh","Beihilfe"]];
const SN=k=>k==="pkv"?"AXA":"Beihilfe";
const S={inv:[],besch:[],deleted:{},settings:structuredClone(DEFAULT_SETTINGS),loaded:false,area:"zutun",archiv:"rechnungen",person:"alle",
  edit:null,select:null,q:"",searchOpen:false,open:new Set(),closed:new Set(),guide:null,idx:new Map()};

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>(+n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dfmt=s=>{if(!s)return "";const [y,m,d]=String(s).slice(0,10).split("-");return d+"."+m+"."+y};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addMonths=(iso,m)=>{const d=new Date(iso+"T12:00:00");d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)};
const numIn=x=>{x=String(x??"").trim();if(x==="")return "";return r2(x.includes(",")?x.replace(/\./g,"").replace(",","."):x)};
const nowIso=()=>new Date().toISOString();
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const monthLabel=k=>k?`${MONTHS[+k.slice(5,7)-1]} ${k.slice(0,4)}`:"Ohne Datum";
const isApo=inv=>inv.kind==="apotheke";
const ASK_DAYS=28; // ohne Bescheid länger als 4 Wochen: nachfragen
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
// Wer stellt die Rechnung, wer bekommt das Geld
const payee=inv=>inv.billing||inv.doctor||"";
const title=inv=>inv.doctor||inv.billing||"Ohne Arzt";

/* ================= Bescheid-Index: welche Bescheide gehören zu welcher Rechnung ================= */
function reindex(){
  const m=new Map();
  for(const b of S.besch)for(const it of b.items||[]){const e=m.get(it.invId)||{pkv:[],bh:[]};e[b.k].push({b,it});m.set(it.invId,e)}
  for(const e of m.values())for(const k of ["pkv","bh"])e[k].sort((x,y)=>(x.b.date||"").localeCompare(y.b.date||"")||(x.b.createdAt||"").localeCompare(y.b.createdAt||""));
  S.idx=m;
}
const itemsOf=(invId,k)=>S.idx.get(invId)?.[k]||[];

/* ================= Berechnung: Stand je Seite ================= */
function side(inv,k){
  const s=inv[k]||{};const rate=+s.rate||0;const amount=+inv.amount||0;
  const expected=rate>0?r2(amount*rate-(+s.deduction||0)):0;
  const list=itemsOf(inv.id,k),last=list[list.length-1]||null;
  const state=last?"done":rate<=0?"na":s.submitted?"wait":"todo";
  const received=last?r2(last.it.refund):0;
  const diff=last?r2(expected-received):0;
  const b=last?.b||null;
  const moneyOpen=!!(last&&received>0.004&&!b.moneyIn);
  const objOpen=!!(s.obj&&!s.obj.result);
  const reason=last&&diff>0.004?reasonOf(inv,last.it,received):null;
  const cutOpen=!!(last&&diff>0.004&&!s.cutOk&&!s.obj&&reason!=="ok");
  const waitDays=state==="wait"?days(s.submitted,today()):0;
  const askDue=state==="wait"&&waitDays>ASK_DAYS&&!(s.asked&&days(s.asked,today())<=ASK_DAYS);
  return {k,rate,expected,state,received,diff,b,item:last?.it||null,list,moneyOpen,objOpen,cutOpen,reason,waitDays,askDue,s};
}
/* Antragsnummer (v87): Die Beihilfe-App vergibt sie erst nach dem Einreichen, deshalb wird sie danach eingetragen.
   Der Bescheid nennt sie als „AppID“. Bei einer Nachreichung gibt es eine neue Nummer, der Bescheid nennt aber weiter
   die des ursprünglichen Antrags. Deshalb zählen: aktuelle Nummer (antrag), frühere Nummern (antragPrev) und die AppIDs
   der Bescheide, die schon zur Rechnung gehören. */
const ANTRAG_FROM="2026-11-25"; // ältere Einreichungen nicht nachträglich abfragen
const antragOk=v=>/^\d{5,10}$/.test(String(v||""));
function antragIds(inv,k){const s=inv[k]||{};const ids=new Set([s.antrag,...(s.antragPrev||[])].filter(Boolean).map(String));
  for(const {b} of itemsOf(inv.id,k))if(b.appId)ids.add(String(b.appId));return ids}
function antragMissing(inv,k="bh"){const s=inv[k]||{};return !s.antrag&&!!s.submitted&&s.submitted>=ANTRAG_FROM&&side(inv,k).state==="wait"}
function antragGroups(rows){const g=new Map();
  for(const {i} of rows)if(antragMissing(i)){const d=i.bh.submitted;if(!g.has(d))g.set(d,[]);g.get(d).push(i)}
  return [...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]))}
const antragInput=(key,btnAct,extra="")=>`<span class="antragrow"><input inputmode="numeric" autocomplete="off" placeholder="Antragsnummer, z. B. 9991863" data-antrag-in="${esc(key)}" aria-label="Antragsnummer"><button type="button" class="btn primary" data-act="${btnAct}" data-d="${esc(key)}"${extra}>Speichern</button></span>`;
async function saveAntrag(key,ids){
  const inp=document.querySelector(`[data-antrag-in="${CSS.escape(key)}"]`);const v=String(inp?.value||"").replace(/\D/g,"");
  if(!antragOk(v)){toast("Bitte die Antragsnummer aus der Beihilfe-App eintragen (nur Ziffern).");inp?.focus();return 0}
  let n=0;for(const id of ids){const i=S.inv.find(x=>x.id===id);if(!i)continue;const c=structuredClone(i);c.bh.antrag=v;await saveInvoice(c,true);n++}
  scheduleSync();toast(`Antrag ${v} bei ${n} Rechnung${n===1?"":"en"} eingetragen`);return n}
/* Gründe für Kürzung/Ablehnung aus dem Bescheid-Text erkennen (feste Regeln, keine KI).
   Die Hinweis-Nummern sind je Bescheid verschieden, deshalb zählt nur der Text.
   ok = akzeptieren ohne Aufgabe (Eigenbehalt, rezeptfrei, Höchstbetrag, § 48). */
const REASONS=[
  ["ehe",/§\s*6\s*Abs(?:atz|\.)?\s*2\s*BBhV|Ehepartner\/in|Anlage\s*"?Ehegatte/i],
  ["doppelt",/doppelvorlage|doppelabrechnung|bereits\s+abgerechnet|identisch\s+zu\s+sein\s+scheint|nicht\s+nochmals\s+ein|gleichen\s+Leistungserbringers/i],
  ["original",/sonstiger\s+beleg|zahlungserinnerung|mahnung/i],
  ["gebuehr",/gebührenziffer|gebührenrahmen|wirtschaftlich\s+angemessen/i],
  ["ok",/nicht\s+verschreibungspflichtig|§\s*49\s*Abs(?:atz|\.)?\s*[12]|gesondert\s+berechnete\s+Unterkunft|§\s*48\s*BBhV|hochgerechnet/i]];
function reasonOf(inv,it,received){
  const t=String(it?.note||"");
  for(const [c,re] of REASONS)if(re.test(t))return c;
  // Ablehnung ohne Hinweis, aber zur Rechnung liegt nur eine Zahlungserinnerung vor

/* Ein Status je Rechnung. Schritte streng nacheinander:
   einreichen -> bescheid (warten) -> geld (warten) -> bezahlen -> erledigt.
   Daneben Aufgaben zum Klären (Kürzung, Fehlbuchung, Nachfragen …), die den Ablauf nicht blockieren. */
const STEP_LABEL={einreichen:"Einreichen",bescheid:"Warten auf Bescheid",geld:"Warten auf Geld",bezahlen:"Arzt bezahlen",erledigt:"Erledigt"};
const TASK_LABEL={einreichen:"Einreichen",bezahlen:"Arzt bezahlen",kuerzung:"Kürzung oder Ablehnung: akzeptieren oder Widerspruch",fehlbuchung:"AXA über Fehlbuchung informieren",
  nachreichen:"Unterlagen nachreichen",original:"Originalrechnung anfordern",nachfrage:"Nachfragen",nachfragen:"Nachfragen: lange kein Bescheid",zahlung:"Zahlung klären",sonst:"Klären",
  r_ehe:"Formular Ehepartner/in nachreichen, dann neu einreichen",r_doppelt:"Doppelt eingereicht: nicht erneut einreichen",
  r_original:"Keine echte Rechnung: Original anfordern, dann neu einreichen",r_gebuehr:"Arzt hat falsch abgerechnet: akzeptieren oder Korrektur anfragen"};
const KLAEREN=["r_ehe","r_original","r_gebuehr","r_doppelt","kuerzung","fehlbuchung","nachreichen","original","nachfrage","nachfragen","zahlung","sonst"];
function calc(inv){
  const amount=r2(inv.amount),fee=r2(inv.fee);
  const paid=isApo(inv)&&!(+inv.payment?.amount)?amount:r2(inv.payment?.amount);
  const open=r2(amount+fee-paid),unpaid=open>0.004;
  const pkv=side(inv,"pkv"),bh=side(inv,"bh");
  const due=dueDate(inv),daysLeft=due?days(today(),due):null;
  const overdue=unpaid&&daysLeft!==null&&daysLeft<0;
  const dueSoon=unpaid&&daysLeft!==null&&daysLeft>=0&&daysLeft<=(+S.settings.warnDays||7);
  const todo=pkv.state==="todo"||bh.state==="todo";
  const wait=pkv.state==="wait"||bh.state==="wait";
  // Geld abwarten nur, solange der Arzt noch nicht bezahlt ist (Regel: erst bezahlen, wenn die Erstattung da ist)
  const money=unpaid&&(pkv.moneyOpen||bh.moneyOpen);
  const step=todo?"einreichen":wait?"bescheid":money?"geld":unpaid?"bezahlen":"erledigt";
  const over=open<-0.004&&!inv.refundDue;
  const tasks=[];
  if(step==="einreichen")tasks.push({t:"einreichen"});
  if(step==="bezahlen")tasks.push({t:"bezahlen"});
  for(const x of [pkv,bh]){if(x.cutOpen)tasks.push({t:REASON_TASK[x.reason]||"kuerzung",k:x.k});if(x.askDue)tasks.push({t:"nachfragen",k:x.k})}
  if(over||inv.refundDue)tasks.push({t:"zahlung"});
  for(const is of inv.issues||[])if(!is.done)tasks.push({t:KLAEREN.includes(is.kind)?is.kind:"sonst",issue:is.id});
  tasks.sort((a,b)=>taskOrder(a)-taskOrder(b));
  const objOpen=pkv.objOpen||bh.objOpen;
  const running=step==="bescheid"||step==="geld"||objOpen;
  const cut=r2((pkv.cutOpen?pkv.diff:0)+(bh.cutOpen?bh.diff:0));
  return {amount,fee,paid,open,unpaid,over,due,daysLeft,overdue,dueSoon,pkv,bh,todo,wait,money,step,tasks,objOpen,running,cut,
    klaeren:tasks.filter(x=>x.t!=="einreichen"&&x.t!=="bezahlen"),archived:step==="erledigt"&&!tasks.length&&!objOpen};
}
function taskOrder(x){const o=["einreichen","bezahlen",...KLAEREN];return o.indexOf(x.t)}
const taskKey=x=>[x.t,x.k||"",x.issue||""].join(":");

        items:[],moneyIn:date,createdAt:date+"T12:00:00.000Z",updatedAt:nowIso(),origin:"kopie"};besch.set(key,b)}

function matchQ(i,q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;
  const amt=+i.amount||0;const amtTxt=[amt.toFixed(2).replace(".",","),amt.toFixed(2),eur(amt).toLowerCase(),String(amt)].join(" ");
  const ids=SIDES.flatMap(([k])=>[...antragIds(i,k)]).join(" ");
  const hay=[i.doctor,i.billing,i.treatDate,i.invoiceNo,(i.invoiceNo||"").replace(/[^0-9a-z]/gi,""),i.patient,i.reason,i.note,dfmt(i.invoiceDate),dfmt(i.receivedDate),i.invoiceDate,amtTxt,ids].join(" ").toLowerCase();
  return words.every(w=>{
    if(/^\d+([.,]\d{1,2})?$/.test(w)&&/[.,]/.test(w)){const n=+w.replace(",",".");if(Math.abs(n-amt)<0.005)return true}
    return hay.includes(w)||hay.includes(w.replace(/[^0-9a-z]/gi,""))&&w.replace(/[^0-9a-z]/gi,"").length>=3;
  });
}

/* ---- Läuft: wartet auf AXA, Beihilfe oder Kasse ---- */
function laeuftHtml(rows){

  else{const g=new Map();for(const r of w){const d=[r.c.pkv,r.c.bh].filter(x=>x.state==="wait").map(x=>x.s.submitted).sort().pop()||"";if(!g.has(d))g.set(d,[]);g.get(d).push(r)}
    for(const d of [...g.keys()].sort((a,b)=>b.localeCompare(a))){const list=g.get(d),ago=d?days(d,today()):null;
      const sum=list.reduce((a,{c})=>a+(c.pkv.state==="wait"?c.pkv.expected:0)+(c.bh.state==="wait"?c.bh.expected:0),0);
      h+=grp("w:"+d,d?"Eingereicht am "+dfmt(d):"Ohne Datum",`${ago!==null?(ago===0?"heute":`vor ${ago} Tag${ago===1?"":"en"}`)+" · ":""}${list.length} Rechnung${list.length===1?"":"en"}`,eur(sum),list.map(r=>cardHtml(r,{})).join(""))}}
  // Je Rechnung eine Karte: AXA und Beihilfe untereinander, jeweils mit „Geld da“
  const gm=rows.filter(r=>r.c.pkv.moneyOpen||r.c.bh.moneyOpen).sort((a,b)=>(a.i.invoiceDate||"").localeCompare(b.i.invoiceDate||""));

}

/* ---- Archiv: erledigte Rechnungen und alle Bescheide ---- */
function archivHtml(rows){
  let h=`<nav class="chips" aria-label="Archiv"><button type="button" class="chip" data-arch="rechnungen" aria-pressed="${S.archiv==="rechnungen"}">Rechnungen</button><button type="button" class="chip" data-arch="bescheide" aria-pressed="${S.archiv==="bescheide"}">Bescheide</button></nav>`;
  if(S.archiv==="bescheide"){
    const bs=S.besch.filter(bescheidMine).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(!bs.length)return h+`<div class="empty">Noch keine Bescheide.</div>`;
    const g=new Map();for(const b of bs){const k=(b.date||"").slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(b)}
    const keys=[...g.keys()];
    keys.forEach((k,i)=>{const list=g.get(k);h+=grp("bm:"+k,monthLabel(k),`${list.length} Bescheid${list.length===1?"":"e"}`,eur(list.reduce((a,b)=>a+bescheidSum(b),0)),list.map(b=>bcardHtml(b,false)).join(""),i===0)});
    return h;
  }
  const done=rows.filter(r=>r.c.archived).sort((a,b)=>(b.i.invoiceDate||"").localeCompare(a.i.invoiceDate||""));
  if(!done.length)return h+`<div class="empty">Noch nichts erledigt.</div>`;
  const g=new Map();for(const r of done){const k=(r.i.invoiceDate||"").slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(r)}
  [...g.keys()].forEach((k,i)=>{const list=g.get(k);const back=list.reduce((a,{c})=>a+c.pkv.received+c.bh.received,0);
    h+=grp("rm:"+k,monthLabel(k),`${list.length} Rechnung${list.length===1?"":"en"} · erstattet ${eur(back)}`,eur(list.reduce((a,{c})=>a+c.amount,0)),list.map(r=>cardHtml(r,{})).join(""),i===0)});
  return h;
}
/* ---- Karte einer Rechnung ---- */
function lineText(i,c,task){
  if(task)return taskLine(i,c,task);
  if(c.step==="einreichen"){const w=[c.pkv.state==="todo"&&"AXA",c.bh.state==="todo"&&"Beihilfe"].filter(Boolean);return `Einreichen bei ${w.join(" und ")}${c.bh.state==="todo"&&eheNeeded(i)?" · Formular Ehepartner/in mitschicken":""}`}
  if(c.step==="bescheid"){const w=[c.pkv,c.bh].filter(x=>x.state==="wait").map(x=>`${SN(x.k)} ${eur(x.expected)}`);return `Warten auf Bescheid: ${w.join(" und ")}`}
  if(c.step==="geld"){const w=[c.pkv,c.bh].filter(x=>x.moneyOpen).map(x=>`${SN(x.k)} ${eur(x.received)}`);return `Warten auf Geld: ${w.join(" und ")}`}
  if(c.step==="bezahlen")return `Jetzt ${eur(c.open)} an ${payee(i)||"den Arzt"} überweisen`;
  if(c.objOpen)return "Widerspruch eingelegt, Ergebnis offen";
  return "";
}
function taskLine(i,c,x){
  if(x.t==="kuerzung"){const s=c[x.k];return s.received<=0.004?`${SN(x.k)} hat abgelehnt (0 € statt ${eur(s.expected)})`:`${SN(x.k)} hat ${eur(s.diff)} weniger erstattet`}
  if(x.t==="r_ehe")return `${SN(x.k)}: Formular Ehepartner/in fehlt – nachreichen, dann neu einreichen`;
  if(x.t==="r_doppelt")return `${SN(x.k)}: schon früher abgerechnet – nicht erneut einreichen`;
  if(x.t==="r_original")return `${SN(x.k)}: keine echte Rechnung – Original anfordern, dann neu einreichen`;
  if(x.t==="r_gebuehr")return `${SN(x.k)}: ${eur(c[x.k].diff)} gekürzt wegen Abrechnungsfehler des Arztes`;
  if(x.t==="nachfragen"){const s=c[x.k];return `${SN(x.k)}: seit ${s.waitDays} Tagen kein Bescheid`}
  if(x.t==="zahlung")return i.refundDue?`${eur(-c.open)} zu viel bezahlt: zurückfordern`:`${eur(-c.open)} mehr überwiesen als die Rechnung`;
  const is=(i.issues||[]).find(z=>z.id===x.issue);return is?.text||TASK_LABEL[x.t];
}
function dueText(c){
  if(!c.unpaid||!c.due)return "";
  if(c.overdue)return `<span class="due bad">Fällig seit ${dfmt(c.due)} (${-c.daysLeft} Tg. überfällig)</span>`;
  if(c.dueSoon)return `<span class="due warn">Fällig am ${dfmt(c.due)} (${c.daysLeft===0?"heute":"in "+c.daysLeft+" Tg."})</span>`;
  return `<span class="due">Fällig am ${dfmt(c.due)}</span>`;
}

/* ---- Überblick: Zahlen mit Rechnungen, Bescheide/Anträge, Geldfluss ---- */
function moneyModel(rows){
  const lim=addDays(today(),-21);
  const way=new Map(),req=new Map(),old=[],you=[],pay=[];
  const add=(m,key,lab,sub,i,amt,bid)=>{const g=m.get(key)||{lab,sub,amt:0,items:[],bid};g.amt+=amt;g.items.push({i,amt});m.set(key,g)};
  for(const {i,c} of rows){
    if(c.unpaid)pay.push({i,amt:c.open,sub:i.dueDate?`fällig ${dfmt(i.dueDate)}`:"ohne Fälligkeit"});
    for(const x of [c.bh,c.pkv]){const n=SN(x.k);
      if(x.state==="wait")add(req,x.k+"|"+x.s.submitted,`${n}, eingereicht am ${dfmt(x.s.submitted)}`,"Bescheid fehlt noch · Betrag geschätzt",i,x.expected);
      else if(x.state==="todo")you.push({i,amt:x.expected,sub:`bei ${n} einreichen`});
      else if(x.moneyOpen){if((x.b?.date||"")<lim)old.push({i,amt:x.received,sub:`${n}-Bescheid vom ${dfmt(x.b?.date)}`});
        else add(way,x.b?.id||x.k,`${n}-Bescheid vom ${dfmt(x.b?.date)}`,"kommt in den nächsten Tagen",i,x.received,x.b?.id)}
      if(x.cutOpen&&["ehe","original"].includes(x.reason))you.push({i,amt:x.diff,sub:TASK_LABEL[REASON_TASK[x.reason]]})}}
  return {way,req,old,you,pay}}
const tot=a=>a.reduce((s,x)=>s+x.amt,0);

function guideTasks(rows=rowsFor()){
  return rows.flatMap(r=>r.c.tasks.map(x=>({id:r.i.id,key:taskKey(x),t:x.t,i:r.i,c:r.c})))
    .sort((a,b)=>taskOrder(a)-taskOrder(b)||(a.t==="bezahlen"?(a.c.due||"9").localeCompare(b.c.due||"9"):(a.i.invoiceDate||"").localeCompare(b.i.invoiceDate||"")));
}
function guideSummary(t){const n={};for(const x of t){const g=x.t==="einreichen"||x.t==="bezahlen"?x.t:"klaeren";n[g]=(n[g]||0)+1}
  return [n.einreichen&&`${n.einreichen} × einreichen`,n.bezahlen&&`${n.bezahlen} × bezahlen`,n.klaeren&&`${n.klaeren} × klären`].filter(Boolean).join(" · ")}
function guideStart(){
  const t=guideTasks();if(!t.length){toast("Gerade nichts zu tun");return}
  S.guide={items:t.map(x=>({id:x.id,key:x.key,t:x.t})),i:0};openView(S.guide.items[0].id,S.guide.items[0].key);
}
function guideOpen(it){const inv=S.inv.find(x=>x.id===it.id);return !!inv&&hasTask(calc(inv),it.key)}
function guideNext(){
  const g=S.guide;if(!g)return;g.i++;
  while(g.i<g.items.length&&!guideOpen(g.items[g.i]))g.i++;
  if(g.i>=g.items.length){S.guide=null;closeSheet();render();toast("Fertig. Alle Aufgaben durchgegangen.");return}

}

async function shrink(file,max,q){
  if(!file.type.startsWith("image/"))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",q));}catch{return file}
}

const AI_SKIP=new Set(["aiask","aisuggest","aisugdo","aisugno","logadd","logsave","logno","issueadd","issuesave","issueno","edit","del","close","copy","copytxt","bopen","cancel","save","guidestart","gstop","gnext","giroshare","subshare","dupopen"]);
async function aiSuggest(inv){
  const c=calc(inv);

    .map(x=>({act:x.dataset.act,k:x.dataset.k||"",label:x.textContent.trim().slice(0,80)}));
  const uniq=[];for(const a of acts)if(!uniq.some(u=>u.act===a.act&&u.k===a.k&&u.label===a.label))uniq.push(a);
  if(!uniq.length){S.edit.ai={...(S.edit.ai||{}),open:true,sugNone:"Für diese Rechnung gibt es gerade keine Aktion. Es heißt warten."};return drawView()}
  S.edit.ai={...(S.edit.ai||{}),open:true,busy:true,sug:null,sugNone:null};drawView();
  const q=`Welche der folgenden Aktionen sollte als Nächstes ausgeführt werden? Wähle genau eine – oder "keine", wenn gerade nur Warten sinnvoll ist. Wähle keine Aktion, deren Voraussetzung laut Verlauf noch fehlt (z. B. „Neu einreichen“, solange angeforderte Unterlagen oder ein Duplikat noch nicht eingetroffen sind).
${uniq.map((a,i)=>`A${i+1}: ${a.label}`).join("\n")}
Antworte NUR mit JSON: {"aktion":"A1","begruendung":"ein kurzer Satz"} oder {"aktion":"keine","begruendung":"..."}`;
  try{let ans=await aiCall(q,aiContext(inv,c),200);
    if(typeof ans==="string"){const m=ans.match(/\{[\s\S]*\}/);if(!m)throw new Error("Die KI hat keine verwertbare Antwort geliefert.");ans=JSON.parse(m[0])}
    const j=+String(ans.aktion||"").replace(/\D/g,"")-1,a=uniq[j];

async function askAI(inv,c,q){
  S.edit.ai={open:true,q,busy:true};drawView();

    const t=await r.text();

    if(!r.ok)throw new Error(`KI nicht erreichbar (${r.status}). ${/limit|neuron|quota/i.test(t)?"Tageskontingent aufgebraucht, morgen wieder.":""}`);
    const d=JSON.parse(t);if(d.error)throw new Error(d.error);
    S.edit.ai={open:true,q,answer:(typeof d.answer==="string"?d.answer:JSON.stringify(d.answer,null,1))||"Keine Antwort erhalten."}}
  catch(e){S.edit.ai={open:true,q,err:e.message||"Fehler bei der KI-Anfrage"}}
  if(S.edit?.id===inv.id)drawView();
}

    case "feeover":{const c0=calc(inv);inv.fee=r2((+inv.fee||0)-c0.open);await saveInvoice(inv);toast(`Mahngebühr ${eur(inv.fee)} eingetragen`);return again()}
    case "refunddue":inv.refundDue=true;await saveInvoice(inv);toast("Markiert: Geld beim Arzt zurückfordern");return again();
    case "refundok":{const back=-calc(inv).open;inv.payment={...inv.payment,amount:r2((+inv.amount||0)+(+inv.fee||0))};inv.refundDue=false;
      inv.note=(inv.note?inv.note+" · ":"")+`${eur(back)} vom Arzt zurück am ${dfmt(today())}`;await saveInvoice(inv);toast("Rückzahlung eingetragen");return again()}
    case "giroshare":{const p=payData(inv,calc(inv));try{const bl=await QR.png(giroText(p),`${eur(p.amount)} an ${p.name}`);
      const f=new File([bl],`Ueberweisung_${(p.name||"Arzt").replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,"_").slice(0,30)}_${p.amount.toFixed(2).replace(".",",")}.png`,{type:"image/png"});
      if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:f.name});S.edit.giroSent=true}catch{}}
      else{const u=URL.createObjectURL(bl);const a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);S.edit.giroSent=true}
      }catch{toast("QR-Code konnte nicht erstellt werden")}return again()}
    case "paid":inv.payment={date:today(),amount:r2((+inv.amount||0)+(+inv.fee||0))};S.edit.showPay=false;await saveInvoice(inv);toast("Als bezahlt markiert");return again();
    case "paysec":S.edit.showPay=true;again();$(".nextstep")?.scrollIntoView({block:"start"});return;
    case "copy":{const p=payData(inv,calc(inv));let v=p[k];if(k==="amount")v=p.amount.toFixed(2).replace(".",",");try{await navigator.clipboard.writeText(String(v));toast("Kopiert: "+v)}catch{toast(String(v))}return}
    case "opendoc":return openRef(inv.doc);
    case "adddoc":{closeSheet();const r=await scanDocument("Rechnung scannen");if(!r)return openView(inv.id);const f=r.pdf||r.file;const blob=f.type.startsWith("image/")?await shrink(f,2200,0.85):f;
      inv.doc={fileId:await storeFile(blob,fname(inv,blob)),own:true};await saveInvoice(inv);return openView(inv.id)}
  }
}

async function takeShared(){

  try{const c=await caches.open("share-inbox");const key=new URL("shared-file",location.origin+location.pathname).href;
    const r=await c.match(key);if(!r)return;const b=await r.blob();await c.delete(key);
    takeIncoming(new File([b],decodeURIComponent(r.headers.get("x-name")||"Dokument"),{type:b.type||r.headers.get("content-type")||""}))}catch{toast("Die geteilte Datei konnte nicht gelesen werden.")}
}
// Bescheid oder Rechnung? Erst am Namen, sonst am Inhalt erkennen
const BESCHEID_RE=/beihilfebescheid|beihilfenummer|festgesetzte\s+beihilfe|leistungsabrechnung|erstattungsbetrag|auszahlungsbetrag|bemessungssatz/i;
async function takeIncoming(f){
  while(!S.loaded)await new Promise(r=>setTimeout(r,100));
  if(S.edit)closeSheet();
  if(/^Bescheid_|leistungsabrechnung|bescheid/i.test(f.name))return openProof({file:f});
  toast("Dokument wird gelesen …");
  let text="";try{text=await readText({file:f})}catch{}
  if(text&&BESCHEID_RE.test(text))return openProof({file:f});
  if(text&&text.replace(/\s/g,"").length>80)return openNew({file:f});
  sheet("Dokument übernehmen",`<div class="sec"><p class="status" style="margin:0">${esc(f.name)}</p>
    <div class="btnrow"><button type="button" class="btn primary" data-act="inproof">Bescheid</button><button type="button" class="btn" data-act="ininv">Neue Rechnung</button></div></div>`,
    `<button type="button" class="btn" data-act="incancel">Abbrechen</button>`);
  $("#scrim").addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="incancel")return closeSheet();
    if(b.dataset.act==="inproof"){closeSheet();return openProof({file:f})}
    if(b.dataset.act==="ininv"){closeSheet();return openNew({file:f})}});
}

// IBAN mit früheren Rechnungen desselben Empfängers abgleichen
function checkKnownIban(){
  if(!S.edit?.conf)return;readForm();const inv=S.edit.inv;const name=payee(inv).trim().toLowerCase();if(!name||!inv.iban)return drawConf();
  const prev=[...new Set(S.inv.filter(x=>x.id!==inv.id&&payee(x).trim().toLowerCase()===name&&x.iban).map(x=>x.iban))];
  const c=S.edit.conf.iban||(S.edit.conf.iban={lvl:"check"});
  if(prev.includes(inv.iban)){if(c.lvl!=="ok"){c.lvl="ok";c.msg="Gleiche IBAN wie bei früheren Rechnungen."}}
  else if(prev.length){c.lvl="warn";c.done=false;c.msg=`Weicht von früheren Rechnungen ab (bisher …${prev[0].slice(-6)}). Bitte genau prüfen.`}
  drawConf();
}
// Vorschläge aus früheren Rechnungen desselben Arztes bzw. derselben Abrechnungsstelle
function suggestFrom(){
  readForm();const inv=S.edit.inv;const d=inv.doctor.trim().toLowerCase(),bl=inv.billing.trim().toLowerCase();if(!d&&!bl)return;
  const same=x=>x.id!==inv.id&&(d&&(x.doctor||"").trim().toLowerCase()===d||bl&&(x.billing||"").trim().toLowerCase()===bl);
  const prev=S.inv.filter(same).sort((a,b)=>(b.invoiceDate||"").localeCompare(a.invoiceDate||""));if(!prev.length)return;
  const filled=[];const samePay=prev.filter(x=>payee(x).trim().toLowerCase()===payee(inv).trim().toLowerCase());
  const ib=samePay.find(x=>x.iban)?.iban;if(ib&&!$("#iban").value){$("#iban").value=ib;filled.push("IBAN")}
  const rs=prev.find(x=>x.reason)?.reason;if(rs&&!$("#reason").value){$("#reason").value=rs;filled.push("Grund")}
  if(bl&&!d){const ds=[...new Set(prev.filter(x=>(x.billing||"").trim().toLowerCase()===bl).map(x=>x.doctor).filter(Boolean))];if(ds.length===1){$("#doctor").value=ds[0];filled.push("Arzt")}}
  const pats=[...new Set(prev.map(x=>x.patient).filter(Boolean))];
  if(!inv.id&&!S.edit.patientLocked&&pats.length===1&&S.settings.people.some(p=>p.name===pats[0])&&$("#patient").value!==pats[0]){
    $("#patient").value=pats[0];const r=rateFor(pats[0]);$("#pkv_rate").value=Math.round(r.pkv*100);$("#bh_rate").value=Math.round(r.bh*100);filled.push("Person")}
  readForm();refreshCalc();showDup();
  if(filled.length)setStatus(`Von früheren Rechnungen übernommen: ${filled.join(", ")}.`);
}
const normNo=s=>String(s||"").replace(/[\s\/\-.]/g,"").toLowerCase();
function findDuplicate(inv){
  const no=normNo(inv.invoiceNo),pay=payee(inv).trim().toLowerCase();
  return S.inv.find(x=>x.id!==inv.id&&((no.length>=3&&normNo(x.invoiceNo)===no)||
    (pay&&inv.invoiceDate&&inv.amount!==""&&payee(x).trim().toLowerCase()===pay&&x.invoiceDate===inv.invoiceDate&&r2(x.amount)===r2(inv.amount))));
}
function showDup(){

async function editClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="cancel"){const id=S.edit.inv.id;closeSheet();if(id)openView(id);return}
  if(act==="confok"){const x=S.edit.conf?.[b.dataset.f];if(x)x.done=true;return drawConf()}
  if(act==="aifill")return aiFillInvoice();
  if(act==="aisugf"){const a=S.edit.aiFill,s=a?.sug?.[+b.dataset.i];if(!s)return;readForm();S.edit.inv[s.f]=s.val;S.edit.conf=S.edit.conf||{};S.edit.conf[s.f]={lvl:"check",msg:"Vorschlag der KI übernommen."};
    a.sug=a.sug.filter(x=>x!==s);drawEditor();if(["doctor","billing"].includes(s.f))suggestFrom();if(s.f==="iban")checkKnownIban();return}
  if(act==="dupopen"){const id=S.edit.dup?.id;closeSheet();if(id)openView(id);return}
  if(act==="dupsave"){S.edit.dupOk=true;$("#dupBox").innerHTML="";return editClick({target:$("#btnSave")})}
  if(act==="save"){
    readForm();const inv=S.edit.inv;
    if(inv.amount===""||!inv.doctor){setStatus("Bitte mindestens Arzt und Betrag eintragen.",true);return}
    const pend=confPending();if(pend.length){drawConf();$("#confBox").scrollIntoView({block:"start",behavior:"smooth"});setStatus(`Bitte zuerst prüfen und bestätigen: ${pend.map(k=>CONF_LABEL[k]).join(", ")}.`,true);return}
    if(!inv.id&&!S.edit.dupOk&&findDuplicate(inv)){showDup();$("#dupBox").scrollIntoView({block:"center"});setStatus("Bitte prüfen: möglicherweise doppelt.",true);return}
    b.disabled=true;
    try{
      if(S.edit.file){const blob=await shrink(S.edit.file,2200,0.85);inv.doc={fileId:await storeFile(blob,fname(inv,blob)),own:true};S.edit.file=null;
        if(S.edit.thumb0)inv.thumbFileId=await storeFile(await shrink(S.edit.thumb0,900,0.7),"vorschau.jpg")}
      await saveInvoice(inv);toast("Gespeichert");const id=inv.id;closeSheet();openView(id);
    }catch(err){setStatus("Speichern fehlgeschlagen: "+(err?.message||err),true);b.disabled=false}
    return;
  }
  if(act==="del"){
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Wirklich löschen? Nochmal tippen";return}
    const inv=S.edit.inv;
    // Bescheid-Einträge dieser Rechnung entfernen
    for(const k of ["pkv","bh"])for(const {b:bs} of itemsOf(inv.id,k)){const nb=structuredClone(bs);nb.items=nb.items.filter(it=>it.invId!==inv.id);if(nb.items.length)await saveBescheid(nb,true);else await deleteBescheid(nb)}
    await dbDel("invoices",inv.id);if(inv.doc?.fileId)await dbDel("files",inv.doc.fileId).catch(()=>{});
    S.deleted[inv.id]=nowIso();await dbPut("meta",{key:"deleted",items:S.deleted});
    if(inv.doc?.own&&inv.doc.driveId)await queueTrash([inv.doc.driveId]);
    S.inv=S.inv.filter(x=>x.id!==inv.id);reindex();render();closeSheet();toast("Rechnung gelöscht");scheduleSync();
  }
}
/* ---- Texterkennung beim Erfassen ---- */
async function ocr(input){
  setStatus("Texterkennung startet … (beim ersten Mal etwas länger)");
  const qr=await readInvoiceQr(input).catch(()=>null);
  const isPdfText=!input.images&&(input.pdf||input.file)&&!(input.pdf||input.file).type?.startsWith("image/");
  try{
    S.ocrCap=[];let text;try{text=await readText(input)}finally{if(S.edit)S.edit.cap=S.ocrCap;S.ocrCap=null}
    if(!S.edit||S.edit.mode!=="edit")return;
    readForm();const names=[...new Set([...S.inv.map(i=>i.doctor),...S.inv.map(i=>i.billing)].filter(Boolean))];
    const got=parseInvoiceText(text||"",S.settings.people.map(p=>p.name),names);S.edit.ocrText=text||"";S.edit.ocrPatient=!!got.patient;
    const inv=S.edit.inv;const filled=[];
    if(got.amount!=null&&inv.amount===""){inv.amount=got.amount;filled.push("Betrag")}
    if(got.date){inv.invoiceDate=got.date;filled.push("Datum")}
    if(got.due&&!inv.dueDate){inv.dueDate=got.due;filled.push("Fälligkeit")}
    if(got.invoiceNo&&!inv.invoiceNo){inv.invoiceNo=got.invoiceNo;filled.push("Rechnungsnummer")}
    if(got.iban&&!inv.iban){inv.iban=got.iban;filled.push("IBAN")}
    if(got.treat&&!inv.treatDate){inv.treatDate=dfmt(got.treat);filled.push("Behandlungsdatum")}
    // Briefkopf: Abrechnungsstelle oder Arzt? Bei Abrechnungsstellen den behandelnden Arzt aus dem Text suchen
    // Gleiche IBAN wie bei einer früheren Rechnung: Arzt und Abrechnungsstelle von dort (sicherer als der gelesene Briefkopf)
    const ibPrev=(got.iban||qr?.iban)&&S.inv.filter(x=>x.iban&&x.iban===(qr?.iban||got.iban)).sort((a,b)=>(b.invoiceDate||"").localeCompare(a.invoiceDate||""))[0];
    if(ibPrev&&!inv.doctor&&!inv.billing){inv.doctor=ibPrev.doctor||"";inv.billing=ibPrev.billing||"";filled.push(ibPrev.billing?"Abrechnungsstelle (über IBAN)":"Arzt (über IBAN)")}
    const head=ibPrev?"":got.provider||(qr?.name)||"";
    if(head&&BILLING_RE.test(head)){if(!inv.billing){inv.billing=head;filled.push("Abrechnungsstelle")}
      const m=(text||"").match(/(?:im\s+auftrag\s+von|rechnungserstellung\s+erfolgt\s+im\s+auftrag\s+von|behandelnde[rn]?\s+(?:arzt|ärztin)\s*:?)\s*([^\n,]{4,70})/i);
      if(m&&!inv.doctor){inv.doctor=m[1].trim().replace(/[.:]+$/,"");filled.push("Arzt")}}
    else if(head&&!inv.doctor){inv.doctor=head;filled.push("Arzt")}
    if(got.patient){S.edit.patientLocked=true;inv.patient=got.patient;const r=rateFor(got.patient);inv.pkv.rate=r.pkv;inv.bh.rate=r.bh;filled.push("Person")}
    const conf={};
    if(qr){if(qr.amount!=null){inv.amount=qr.amount;conf.amount={lvl:"ok"}}if(qr.iban){inv.iban=qr.iban;conf.iban={lvl:"ok"}}filled.unshift("QR-Code")}
    const pdfMsg=isPdfText?"Aus dem PDF-Text gelesen. Bitte kurz mit dem PDF vergleichen.":"";
    for(const k of ["amount","invoiceDate","invoiceNo"])if(!conf[k]&&inv[k]!==""&&inv[k]!=null&&(k!=="invoiceDate"||got.date))
      conf[k]={lvl:"check",msg:pdfMsg,crop:isPdfText?null:await cropFor(inv[k],k==="invoiceDate"?"date":k==="amount"?"amount":"no")};

Antworte NUR mit JSON: {"art":"rechnung","person":"","arzt":"","abrechnungsstelle":"","rechnungsdatum":"TT.MM.JJJJ","behandlung":"TT.MM.JJJJ oder Zeitraum","betrag":0.00,"rechnungsnummer":"","iban":"","faellig":"TT.MM.JJJJ"}. Unbekannte Felder leer lassen, nichts erfinden.`;

      const diff=f==="amount"?Math.abs(+inv[f]-+v)>0.004:/date|Date/.test(f)?String(inv[f])!==String(v):norm(inv[f])!==norm(v)&&!norm(v).includes(norm(inv[f]))&&!norm(inv[f]).includes(norm(v));
      if(diff)sug.push({f,label,val:v,curTxt:show(f,inv[f]),valTxt:show(f,v)})};

    set("doctor",String(ans.arzt||"").trim(),"Arzt");set("billing",String(ans.abrechnungsstelle||"").trim(),"Abrechnungsstelle");
    set("treatDate",String(ans.behandlung||"").trim(),"Behandlungsdatum");set("invoiceNo",String(ans.rechnungsnummer||"").trim(),"Rechnungsnummer");
    const ib=String(ans.iban||"").replace(/\s/g,"").toUpperCase();if(/^DE\d{20}$/.test(ib))set("iban",ib,"IBAN");
    const p=people.find(n=>n.toLowerCase()===String(ans.person||"").trim().split(/\s+/)[0].toLowerCase());
    if(p&&!e.ocrPatient&&!e.patientLocked){inv.patient=p;const r=rateFor(p);inv.pkv.rate=r.pkv;inv.bh.rate=r.bh;got.push("Person")}
    const art=String(ans.art||"").toLowerCase();
    e.aiFill={sug,warn:art==="mahnung"?"Das ist eine Zahlungserinnerung oder Mahnung, keine Rechnung mit Einzelleistungen. Beihilfe und AXA erstatten darauf nichts. Bitte die Originalrechnung oder ein Duplikat anfordern.":"",
      msg:got.length?`KI hat ergänzt: ${got.join(", ")}.${sug.length?" Abweichungen oben prüfen.":" Bitte prüfen."}`:sug.length?"Die KI hat Abweichungen gefunden.":"Die KI hat gegengelesen: keine Abweichungen."};
    const st=$("#edStatus")?.textContent||"";drawEditor();if(st)setStatus(st);if(inv.doctor||inv.billing)suggestFrom();checkKnownIban();drawAiBox();}
  catch(err){e.aiFill={msg:err.message||"Fehler bei der KI-Anfrage",err:true};drawAiBox()}

/* ================= Bescheid erfassen: ein Bescheid -> mehrere Rechnungen ================= */
// Mit Antragsnummer (AppID): zuerst nur unter den Rechnungen dieses Antrags suchen; findet sich dort nichts, unter allen.
function matchInvoices(text,k,appId){
  if(appId){const pool=S.inv.filter(i=>antragIds(i,k).has(String(appId)));
    if(pool.length){const r=matchInvoices0(text,k,pool);if(r.length){r.byAntrag=true;return r}}}
  return matchInvoices0(text,k,S.inv);
}
function matchInvoices0(text,k,pool){
  const low=text.toLowerCase(),lines=text.split("\n");
  const tw=new Set(provWords(text));
  const amtRe=a=>{const f1=a.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\./g,"\\.?");return new RegExp("(?<![\\d.,])"+f1+"(?![\\d])")};
  const cands=[];
  for(const inv of pool){const s=side(inv,k);if(s.state==="na")continue;
    const a=r2(inv.amount);let score=0,refund=null,eligible=null,hints=[];
    const re=a>0?amtRe(a):null;const li=re?lines.findIndex(l=>re.test(l)):-1;
    if(li>=0){score+=2;
      const l=lines[li],m=l.match(re),rest=l.slice(m.index+m[0].length);const nums=[...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(x=>r2(x[1].replace(/\./g,"").replace(",",".")));
      if(k==="bh"&&nums.length>=2){eligible=nums[0];refund=nums[nums.length-1];
        const all=[...rest.matchAll(/\d{1,3}(?:\.\d{3})*,\d{2}/g)];const last=all[all.length-1];hints=(rest.slice(last.index+last[0].length).match(/\b\d{1,2}\b/g)||[])}
      else if(k==="pkv"&&nums.length>=2){refund=nums[nums.length-1];if(nums[0]>0.004&&nums[0]<=a)eligible=r2(a-nums[0])}
      else if(nums.length)refund=Math.abs(nums[0]-a)<0.005?0:nums[nums.length-1];
      else{for(let j=li+1;j<Math.min(lines.length,li+8);j++){const mm=lines[j].trim().match(new RegExp("^"+re.source+"\\s+(\\d{1,3}(?:\\.\\d{3})*,\\d{2})"));if(mm){refund=r2(mm[1].replace(/\./g,"").replace(",","."));break}}}}
    if(inv.invoiceDate){const [y,m,d]=inv.invoiceDate.split("-");if(text.includes(`${d}.${m}.${y}`)||text.includes(`${d}.${m}.${y.slice(2)}`))score+=2}
    const pw=[...provWords(inv.doctor),...provWords(inv.billing)];if(pw.some(w=>tw.has(w)))score+=1;
    if(inv.patient&&low.includes(inv.patient.toLowerCase()))score+=0.5;
    if(score>=2)cands.push({id:inv.id,score,refund,eligible,hints,amount:a,amt:li>=0,open:s.state!=="done"});
  }
  // Betrag allein reicht, wenn er nur einmal vorkommt (AXA nennt kein Rechnungsdatum).
  // Gleicher Betrag bei mehreren: genau eine offen -> diese; sonst alle zur Auswahl ohne Haken.
  const keep=c=>{
    if(c.score>=3)return true;if(!c.amt)return false;
    const g=cands.filter(o=>o.amt&&o.amount===c.amount);if(g.length===1)return true;
    if(g.some(o=>o.score>=3))return false;
    const op=g.filter(o=>o.open);if(op.length===1)return op[0]===c;
    if(op.length>1&&!c.open)return false;
    c.ambiguous=true;return true};
  return cands.filter(keep).sort((a,b)=>b.score-a.score);
}
async function startProof(k){const r=await scanDocument(`Bescheid ${SN(k)} scannen`);if(r)openProof(r,{k})}
async function openProof(input,pre){
  const file=input.pdf||input.file||input;
  S.edit={mode:"proof",file,urls:[],k:pre?.k||"bh",pre:pre||null,rows:[],date:today(),total:null,busy:true,msg:"Bescheid wird gelesen …"};
  drawProof();
  try{
    const text=await readText(input);if(S.edit?.mode!=="proof")return;
    const p=parseProofText(text);
    S.edit.k=S.edit.pre?.k||p.side||"bh";S.edit.date=p.date||today();S.edit.total=p.total??null;S.edit.text=text;
    if(!p.appId){const fm=String(file?.name||"").match(/Bescheid_\d+_(\d+)_\d+/i);if(fm)p.appId=fm[1]}
    Object.assign(S.edit,{lines:p.lines||[],appId:p.appId||null,notes:p.notes||{},payout:p.payout??null,before:p.before??null,correction:!!p.correction});
    fillProofRows();proofMsg();
  }catch(e){S.edit.msg="Der Bescheid konnte nicht gelesen werden. Bitte die Rechnungen unten selbst zuordnen."}
  S.edit.busy=false;drawProof();
  if(S.settings.aiKey&&S.edit?.mode==="proof"&&S.edit.text)proofAuto(S.edit);
}
// KI automatisch: Zuordnung (wenn nötig), dann Kommentar
async function proofAuto(e){
  const sum=r2(e.rows.filter(r=>r.on).reduce((a,r)=>a+(+r.amount||0),0)),prev=r2(e.rows.filter(r=>r.already&&!r.on).reduce((a,r)=>a+(+r.amount||0),0));
  const needMatch=e.k==="pkv"||!e.rows.length||(e.total!=null&&Math.abs(sum+prev-e.total)>=0.01);
  if(needMatch){await proofMatchAI();if(S.edit!==e)return}
  if(e.rows.length&&!e.aim?.err)await proofAI();
}
function proofMsg(){
  const e=S.edit,n=e.rows.length,old=e.rows.filter(r=>r.already).length,dup=dupBescheid();
  e.msg=dup?`Diesen Bescheid gibt es vermutlich schon (${SN(dup.k)} vom ${dfmt(dup.date)}${dup.appId?", Antrag "+dup.appId:""}). Bitte prüfen, bevor du übernimmst.`
    :!n?"Zu diesem Bescheid ist keine Rechnung in der App. Die Zeilen aus dem Bescheid stehen unten."
    :old===n?`Alle ${n} Rechnung${n===1?"":"en"} haben schon einen Bescheid. Übernehmen legt diesen Bescheid zusätzlich ab, der neueste gilt.`
    :e.rows.some(r=>r.ambiguous)?"Gleicher Betrag bei mehreren Rechnungen – bitte die richtige anhaken."
    :`${n-old} offene Rechnung${n-old===1?"":"en"} gefunden. Bitte Beträge prüfen.`;
}
function dupBescheid(){const e=S.edit;return S.besch.find(b=>b.k===e.k&&((e.appId&&b.appId===e.appId&&b.date===e.date)||(e.total!=null&&b.total!=null&&r2(b.total)===r2(e.total)&&b.date===e.date)))||null}
function fillProofRows(){const e=S.edit,k=e.k;
  const ms=matchInvoices(e.text||"",k,e.appId);e.byAntrag=!!ms.byAntrag;
  e.rows=ms.map(m=>{const inv=S.inv.find(x=>x.id===m.id);const s=side(inv,k);
    const note=(m.hints||[]).map(h=>e.notes?.[h]).filter(Boolean).join(" ");
    return {id:m.id,already:s.state==="done"&&!e.correction,on:!m.ambiguous,ambiguous:!!m.ambiguous,rejected:m.refund===0,eligible:m.eligible,note,
      amount:m.refund!=null?m.refund:s.state==="done"?s.received:s.expected}});
  // „Sonstiger Beleg“ mit 0 € (z. B. Zahlungserinnerung): Betrag = Rechnung + Mahngebühr. Offene Rechnung derselben Person
  // mit bis zu 10 € weniger als Ablehnung zuordnen, wenn sonst keine passt.
  for(const l of e.lines||[]){if(!l.sonst||l.refund>0.004)continue;
    const hit=S.inv.filter(inv=>{const s=side(inv,k);const d=r2(l.amount-r2(inv.amount));
      return s.state==="wait"&&d>0.004&&d<=10&&(inv.patient||"").toLowerCase()===String(l.person).toLowerCase()&&!e.rows.some(r=>r.id===inv.id)});
    if(hit.length===1)e.rows.push({id:hit[0].id,already:false,on:true,ambiguous:false,rejected:true,eligible:0,amount:0,
      note:`Sonstiger Beleg vom ${l.date} über ${eur(l.amount)} (vermutlich Zahlungserinnerung mit Mahngebühr) – keine Rechnung mit Einzelleistungen.`})}
  // Schon erledigte nur anhaken, wenn der Bescheid nur erledigte betrifft (Nachtrag); sonst nur anzeigen und mitzählen
  if(e.rows.some(r=>!r.already))e.rows.forEach(r=>{if(r.already)r.on=false});
  const pid=e.pre?.id;if(pid&&!e.rows.some(r=>r.id===pid)){const inv=S.inv.find(x=>x.id===pid);if(inv){const s=side(inv,k);e.rows.unshift({id:pid,on:true,amount:s.state==="done"?s.received:s.expected})}}
}
function drawProof(){

async function readInvoiceQr(input){

  let det;try{det=new BarcodeDetector({formats:["qr_code"]})}catch{return null}

    if(input.images)for(const im of input.images)srcs.push(await createImageBitmap(im));

      for(let p=1;p<=Math.min(pdf.numPages,2);p++){const page=await pdf.getPage(p);const vp=page.getViewport({scale:2.5});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;srcs.push(cv)}}

function parseGiro(raw){

async function cropFor(value,kind){
  const caps=S.edit?.cap||[];if(!caps.length||value==null||value==="")return null;
  const digits=x=>String(x).replace(/[^0-9]/g,"");
  let want;
  if(kind==="amount")want=digits(Number(value).toFixed(2));
  else if(kind==="date"){const [y,m,d]=String(value).split("-");want=[d+m+y,d+m+y.slice(2)]}
  else if(kind==="iban")want=String(value).slice(0,4).toLowerCase();
  else want=String(value).toLowerCase().replace(/[^0-9a-z]/g,"");
  for(const cap of caps){
    const hit=cap.words.find(w=>{const t=w.text.toLowerCase();
      if(kind==="amount")return digits(t)===want&&/[.,]\d{2}/.test(t);
      if(kind==="date")return want.includes(digits(t))&&digits(t).length>=6;
      if(kind==="iban")return t.replace(/[^0-9a-z]/g,"").startsWith(want);
      return want.length>=3&&t.replace(/[^0-9a-z]/g,"").includes(want)});
    if(!hit?.b)continue;
    const h=hit.b.y1-hit.b.y0,cy=(hit.b.y0+hit.b.y1)/2;
    const line=cap.words.filter(w=>w.b&&Math.abs((w.b.y0+w.b.y1)/2-cy)<h*0.7);
    const x0=Math.min(...line.map(w=>w.b.x0)),x1=Math.max(...line.map(w=>w.b.x1)),y0=Math.min(...line.map(w=>w.b.y0)),y1=Math.max(...line.map(w=>w.b.y1));
    try{const bmp=await createImageBitmap(cap.img);const pad=Math.round(h*0.8);
      const sx=Math.max(0,x0-pad),sy=Math.max(0,y0-pad),sw=Math.min(bmp.width,x1+pad)-sx,sh=Math.min(bmp.height,y1+pad)-sy;
      const sc=Math.min(1,900/sw);const cv=document.createElement("canvas");cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
      cv.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
      const bl=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));const u=URL.createObjectURL(bl);S.edit.urls.push(u);return u}catch{return null}
  }
  return null;
}

function parseInvoiceText(text,people,providers){

      for(const l of [lines[i],lines[i+1]||""]){const ms=[...l.matchAll(dReG)].map(iso).filter(Boolean);if(ms.length){date=ms[ms.length-1];break}}

  const STOP=new Set(["dr","med","prof","dipl","gmbh","ggmbh","mbh","mvz","co","kg","ag","ug","und","u","der","die","das","fuer","für","praxis","gemeinschaftspraxis","zentrum","ohg","gbr","e","v"]);

    const score=n/ws.length+n*0.01;if(score>bestScore){bestScore=score;bestProv=pr}}

  else if(sender)out.provider=sender;
