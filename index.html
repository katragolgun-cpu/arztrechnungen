<style>
/* Layout: mobile-first ledger — summary tiles, filter chips, stack of bill cards with stamp-style status marks; bottom sheet: short view first, details on demand */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e8ecf0; --line:#d5dce3;
  --ink:#16222e; --muted:#5b6b7a;
  --accent:#0d5f6b; --accent-ink:#ffffff;
  --ok:#1f7a45; --ok-soft:#dcefe3;
  --warn:#9a5b00; --warn-soft:#f7ead2;
  --bad:#b0322b; --bad-soft:#f6dedc;
  --wait:#3e5a9a; --wait-soft:#dfe6f5;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SFMono-Regular",Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --surface:#172129; --sunken:#1e2a34; --line:#2b3a46;
  --ink:#e6edf2; --muted:#93a4b3; --accent:#4fb3bf; --accent-ink:#06262b;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e2a54a; --warn-soft:#3a2c14;
  --bad:#f0827a; --bad-soft:#3d1d1b; --wait:#8fa9e6; --wait-soft:#1e2a45; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;margin:0;font-weight:700}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;font:inherit;color:inherit}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .val{font-family:var(--f-num);font-size:20px;font-weight:600}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile.hot .val,.tile.cut .val{color:var(--bad)} .tile.wait .val{color:var(--wait)} .tile.todo .val{color:var(--warn)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.searchinfo{font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0;flex:1}
.row1 .tick+.who{margin-left:2px}
.prov{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.amt{font-family:var(--f-num);font-weight:600;font-size:16px;white-space:nowrap}
.pchip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--ink);margin-right:6px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor;line-height:1.3;white-space:nowrap}
.stamp b{font-family:var(--f-num);font-weight:600;letter-spacing:0;text-transform:none}
.s-ok{color:var(--ok);background:var(--ok-soft)} .s-todo{color:var(--warn);background:var(--warn-soft)}
.s-wait{color:var(--wait);background:var(--wait-soft)} .s-bad{color:var(--bad);background:var(--bad-soft)}
.s-na{color:var(--muted);background:var(--sunken);border-style:dashed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.year{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:50%;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:7}
.fab svg{width:28px;height:28px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.bnav button{position:relative;border:0;background:none;color:var(--ink);font:inherit;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;min-height:58px;border-radius:12px}
.bnav button .ic{display:flex;align-items:center;justify-content:center;width:54px;height:30px;border-radius:999px}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="true"]{color:var(--accent)}
.bnav button[aria-current="true"] .ic{background:var(--sunken)}
.bnav button.zero{color:var(--muted);opacity:.55}
.bnav button.zero[aria-current="true"]{opacity:1;color:var(--accent)}
.bnav .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.bnav button.zero .n{background:var(--sunken);color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn.sq{padding:8px 10px;display:flex;align-items:center}
.iconbtn.sq svg{width:20px;height:20px}
.iconbtn.sq[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-head{flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:18px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-num);font-size:28px;font-weight:600}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.line .t{font-weight:600}
.line .s{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input.num{font-family:var(--f-num)}
.calc{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--sunken);border-radius:9px;padding:8px 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn[disabled]{opacity:.55}
.thumb{width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--sunken)}
.status{font-size:13.5px;color:var(--muted)} .status.err{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.checkline{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13.5px}
#btnSettings{position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font:inherit;color:inherit;text-align:left}
.sumbar .vals{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;min-width:0}
.sumbar .vals b{font-family:var(--f-num);font-weight:600}
.sumbar .pay b{color:var(--bad)} .sumbar .exp b{color:var(--wait)}
.sumbar .chev{color:var(--muted);font-size:13px;white-space:nowrap}
.summary-wrap{display:flex;flex-direction:column;gap:10px}
.sub-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:-4px}
.next{font-size:13.5px;font-weight:600}
.next.s-einreichen{color:var(--warn)} .next.s-warten{color:var(--wait)} .next.s-ueberweisen{color:var(--accent)} .next.s-nachweis{color:var(--bad)}
.due{font-size:12.5px;color:var(--muted)} .due.warn{color:var(--warn);font-weight:600} .due.bad{color:var(--bad);font-weight:600}
.listtools{justify-content:flex-end}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tick{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selinfo{font-size:13.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.pchk{display:flex;gap:10px;align-items:flex-start;min-width:0;font-size:14px}
.pchk input{width:20px;height:20px;flex:none;margin-top:2px}
.scanwrap{display:flex;justify-content:center;margin:12px 0}
.scanwrap canvas{touch-action:none;border-radius:8px;max-width:100%;background:#000}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumbs img{width:84px;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.paygrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px}
.paygrid .k{color:var(--muted);font-size:12.5px}
.paygrid .v{overflow-wrap:anywhere;font-family:var(--f-num)}
.inline{display:flex;gap:8px;align-items:end}
.inline label{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* ---- v20: modernere Optik, Personenbilder ---- */
:root{--r:16px;--shadow:0 1px 2px rgba(16,34,46,.06),0 4px 14px rgba(16,34,46,.06)}
@media (prefers-color-scheme: dark){:root{--shadow:0 1px 2px rgba(0,0,0,.4)}}
body{background:var(--bg)}
header.top h1{font-size:26px;letter-spacing:-.02em}
.card,.tile,.sumbar,.empty,.sec{border-color:transparent;box-shadow:var(--shadow)}
.card{padding:14px 16px;border-radius:var(--r);transition:transform .12s ease}
.card:active{transform:scale(.99)}
.sumbar{background:linear-gradient(135deg,var(--accent),#0a4750);color:#fff;padding:16px 18px;border-radius:20px}

.sumbar .vals{flex-direction:column;gap:2px;font-size:13px;opacity:.95}
.sumbar .vals>span{display:flex;align-items:baseline;gap:8px}
.sumbar .pay b{color:#fff;font-size:26px} .sumbar .exp b{color:#cfe9ec;font-size:15px}
.sumbar .chev{color:#cfe9ec}
.search input{border-radius:14px;border-color:transparent;box-shadow:var(--shadow);padding:12px 40px 12px 14px}
.chip{border-color:transparent;box-shadow:var(--shadow);padding:7px 14px}
.people{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 4px;justify-content:space-between}
.people::-webkit-scrollbar{display:none}
.pbtn{flex:none;border:0;background:none;padding:0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;width:58px}
.pbtn .av{width:50px;height:50px;border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 0 2px transparent;transition:box-shadow .15s}
.pbtn[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.pbtn span{font-size:12.5px;font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn[aria-pressed="true"] span{color:var(--accent)}
.av{display:block;flex:none}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.pchip{display:inline-flex;align-items:center;gap:5px;background:none;padding:0;font-size:12.5px;margin-right:8px;color:var(--ink)}
.pchip .av{width:22px;height:22px;border-radius:50%}
.avsel{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}

.avsel input:checked+.av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Arztrechnungen</h1><p id="sub">Beihilfe und PKV im Blick</p></div>
    <div class="hbtns"><button class="iconbtn sq" id="btnSearch" type="button" aria-label="Alle Rechnungen durchsuchen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="iconbtn sq" id="btnSettings" type="button" aria-label="Einstellungen" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="dot" id="settingsDot" hidden></span></button></div>

<script>
"use strict";
/* ================= Speicher (IndexedDB, nur auf diesem Gerät) ================= */
const DB_NAME="arztrechnungen",DB_VER=1;
let _db;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains("invoices"))d.createObjectStore("invoices",{keyPath:"id"});
      if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"key"});};
    r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error);
  });
}
async function tx(store,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;
    const r=fn(s);if(r&&"onsuccess" in r)r.onsuccess=()=>out=r.result;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
}
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbGet=(s,k)=>tx(s,"readonly",st=>st.get(k));

/* Suche: Rechnungsnummer, Betrag (106,45 / 106.45 / 106), Rechnungssteller, Person, Grund, Notiz, Datum */
function matchQ(i,q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;
  const amt=+i.amount||0;const amtTxt=[amt.toFixed(2).replace(".",","),amt.toFixed(2),eur(amt).toLowerCase(),String(amt)].join(" ");
  const hay=[i.provider,i.invoiceNo,(i.invoiceNo||"").replace(/[^0-9a-z]/gi,""),i.patient,i.reason,i.note,dfmt(i.invoiceDate),dfmt(i.receivedDate),i.invoiceDate,amtTxt,i.bh?.appId,i.pkv?.appId].join(" ").toLowerCase();
  return words.every(w=>{
    if(/^\d+([.,]\d{1,2})?$/.test(w)&&/[.,]/.test(w)){const n=+w.replace(",",".");if(Math.abs(n-amt)<0.005)return true}
    return hay.includes(w)||hay.includes(w.replace(/[^0-9a-z]/gi,""))&&w.replace(/[^0-9a-z]/gi,"").length>=3;
  });
}

/* ================= Berechnung ================= */
function side(inv,key){
  const s=inv[key]||{};const rate=+s.rate||0;const amount=+inv.amount||0;
  const expected=rate>0?r2(amount*rate-(+s.deduction||0)):0;
  let state;
  if(rate<=0)state="na"; else if(!s.submitted)state="todo"; else if(!s.receivedDate)state="wait"; else state="done";
  const received=state==="done"?r2(s.received):0;
  const diff=state==="done"?r2(expected-received):0;
  // Geld eingegangen, Leistungsnachweis noch nicht geprüft (ältere Einträge ohne Angabe gelten als geprüft)
  const review=state==="done"&&s.checked===false;
  const waitDays=state==="wait"&&s.submitted?days(s.submitted,today()):0;
  const cutOpen=state==="done"&&diff>0.004&&!s.cutOk; // Kürzung noch nicht akzeptiert oder per Widerspruch geklärt
  return {rate,expected,state,received,diff,review,waitDays,cutOpen,s};
}
function calc(inv){
  const amount=r2(inv.amount),fee=r2(inv.fee),paid=isApo(inv)&&!(+inv.payment?.amount)?amount:r2(inv.payment?.amount),open=r2(amount+fee-paid); // Mahngebühr: zahlen ja, Erstattung nein
  const pkv=side(inv,"pkv"),bh=side(inv,"bh");
  const unpaid=open>0.004;
  const age=inv.receivedDate?days(inv.receivedDate,today()):0;
  const due=dueDate(inv);
  const daysLeft=due?days(today(),due):null;
  const overdue=unpaid&&daysLeft!==null&&daysLeft<0;
  const dueSoon=unpaid&&daysLeft!==null&&daysLeft>=0&&daysLeft<=(+S.settings.warnDays||7);
  const cut=(pkv.cutOpen?pkv.diff:0)+(bh.cutOpen?bh.diff:0);
  const askLong=pkv.waitDays>ASK_DAYS||bh.waitDays>ASK_DAYS;
  const objOpen=[pkv,bh].some(x=>x.s.obj&&!x.s.obj.result);
  const todo=pkv.state==="todo"||bh.state==="todo";
  const wait=pkv.state==="wait"||bh.state==="wait";
  const review=pkv.review||bh.review;
  const step=todo?"einreichen":wait?"warten":review?"nachweis":unpaid?"ueberweisen":"erledigt";
  const over=open<-0.004&&!inv.refundDue; // überzahlt, noch nicht geklärt
  return {amount,fee,over,paid,open,unpaid,overdue,dueSoon,due,daysLeft,age,pkv,bh,cut,todo,wait,review,step,askLong,objOpen,done:step==="erledigt",check:!!inv.check||cut>0.004||over||!!inv.refundDue};
}
// Fälligkeit: eigenes Datum von der Rechnung, sonst Eingang + Zahlungsfrist
function dueDate(inv){
  if(inv.dueDate)return inv.dueDate;
  const base=inv.invoiceDate||inv.receivedDate;if(!base)return null; // Frist läuft ab Rechnungsdatum
  const d=new Date(base+"T12:00:00");d.setDate(d.getDate()+(+S.settings.payDays||30));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function nextStepText(i,c){
  if(c.step==="einreichen"){const w=[c.pkv.state==="todo"&&"PKV",c.bh.state==="todo"&&"Beihilfe"].filter(Boolean);return `Einreichen bei ${w.join(" und ")}`}
  if(c.step==="warten"){const w=[c.pkv.state==="wait"&&`PKV ${eur(c.pkv.expected)}`,c.bh.state==="wait"&&`Beihilfe ${eur(c.bh.expected)}`].filter(Boolean);
    const long=[["AXA",c.pkv],["Beihilfe",c.bh]].filter(([,x])=>x.waitDays>ASK_DAYS);
    return `Warten auf ${w.join(" und ")}`+(long.length?` · seit ${Math.max(...long.map(([,x])=>x.waitDays))} Tagen, bei ${long.map(([n])=>n).join(" und ")} nachfragen`:"")}
  if(c.step==="nachweis"){const w=[["PKV",c.pkv],["Beihilfe",c.bh]].filter(([,x])=>x.review).map(([n,x])=>x.diff>0.004?`${n} ${eur(x.received)} statt ${eur(x.expected)}`:`${n} ${eur(x.received)}`);return `Nachweis prüfen: ${w.join(", ")}`}
  if(c.step==="ueberweisen")return `Jetzt ${eur(c.open)} überweisen`;
  if(c.objOpen)return "Widerspruch eingelegt, Ergebnis offen";
  if(i.refundDue)return `${eur(-c.open)} zu viel bezahlt: beim Arzt zurückfordern`;
  if(c.over)return `${eur(-c.open)} zu viel überwiesen: Mahngebühr oder Fehler?`;
  if(c.cut>0.004)return `Kürzung ${eur(c.cut)}: Widerspruch einlegen oder akzeptieren`;
  return "";
}
function dueText(c){
  if(!c.unpaid||!c.due)return "";
  if(c.overdue)return `<span class="due bad">Fällig seit ${dfmt(c.due)} (${-c.daysLeft} Tg. überfällig)</span>`;
  if(c.dueSoon)return `<span class="due warn">Fällig am ${dfmt(c.due)} (${c.daysLeft===0?"heute":"in "+c.daysLeft+" Tg."})</span>`;
  return `<span class="due">Fällig am ${dfmt(c.due)}</span>`;
}

async function bulkSubmit(which){
  const keys=which==="both"?["pkv","bh"]:[which];let n=0;
  for(const id of S.select){
    const inv=structuredClone(S.inv.find(x=>x.id===id));if(!inv)continue;let ch=false;
    for(const k of keys){const s=side(inv,k);if(s.state==="todo"){inv[k].submitted=today();ch=true}}
    if(ch){await saveInvoice(inv);n++}
  }
  S.select=null;render();toast(`${n} Rechnung${n===1?"":"en"} als eingereicht markiert`);
}
function stampPay(c){
  if(!c.unpaid)return c.open<-0.004?`<span class="stamp s-bad">Überzahlt <b>${eur(-c.open)}</b></span>`:`<span class="stamp s-ok">Bezahlt</span>`;
  return `<span class="stamp ${c.overdue?"s-bad":"s-todo"}">Zahlen <b>${eur(c.open)}</b>${c.overdue?` · ${c.age} Tg.`:""}</span>`;
}
// Karten in der Liste: nur Probleme als Kästchen (Rest sagt der Text darüber)
function problemStamps(c){
  const out=[];
  // Überfällig, Überzahlt und Nachfragen stehen schon im Text der Karte; Kürzungen nicht immer
  for(const [n,x] of [["AXA",c.pkv],["Beihilfe",c.bh]])if(x.cutOpen&&c.step!=="erledigt")out.push(`<span class="stamp s-bad">${n} gekürzt <b>−${eur(x.diff)}</b></span>`);
  return out.join("");
}
function stampSide(n,s){
  if(s.state==="na")return `<span class="stamp s-na">${n} –</span>`;
  if(s.state==="todo")return `<span class="stamp s-todo">${n} einreichen</span>`;
  if(s.state==="wait")return `<span class="stamp s-wait">${n} <b>${eur(s.expected)}</b> erwartet</span>`;
  if(s.review)return `<span class="stamp s-bad">${n} Nachweis prüfen</span>`;
  if(s.diff>0.004)return `<span class="stamp s-bad">${n} gekürzt <b>−${eur(s.diff)}</b></span>`;
  return `<span class="stamp s-ok">${n} erstattet</span>`;
}
function renderSummary(rows){
  let pay=0,payN=0,over=0,wP=0,wB=0,todoN=0,todoB=0,cut=0,cutN=0;
  for(const {c} of rows){
    if(c.unpaid){pay+=c.open;payN++;if(c.overdue)over++}
    if(c.pkv.state==="wait")wP+=c.pkv.expected;
    if(c.bh.state==="wait")wB+=c.bh.expected;
    if(c.todo)todoN++;
    if(c.bh.state==="todo")todoB+=c.bh.expected;
    if(c.cut>0.004){cut+=c.cut;cutN++}
  }
  const min=+S.settings.minBeihilfe||0;
  const bhHint=todoB<=0?"Nichts offen für die Beihilfe":(todoB>=min?`Beihilfe ${eur(todoB)} – Mindestsumme erreicht`:`Beihilfe ${eur(todoB)}, noch ${eur(min-todoB)} bis ${eur(min)}`);
  $("#summary").innerHTML=`
   <button type="button" class="tile hot" data-f="zahlen"><span class="lbl">Zu bezahlen</span><span class="val">${eur(pay)}</span><span class="sub">${payN} Rechnung${payN===1?"":"en"}${over?` · ${over} überfällig`:""}</span></button>
   <button type="button" class="tile wait" data-f="warten"><span class="lbl">Erstattung erwartet</span><span class="val">${eur(wP+wB)}</span><span class="sub">PKV ${eur(wP)} · Beihilfe ${eur(wB)}</span></button>
   <button type="button" class="tile todo" data-f="einreichen"><span class="lbl">Noch einreichen</span><span class="val">${todoN}</span><span class="sub">${esc(bhHint)}</span></button>
   <button type="button" class="tile cut" data-f="pruefen"><span class="lbl">Gekürzt</span><span class="val">${eur(cut)}</span><span class="sub">${cutN} Rechnung${cutN===1?"":"en"} mit Differenz</span></button>`;
  $("#sub").textContent=`${S.inv.length} Rechnungen · ${S.settings.people.map(p=>p.name).join(", ")}`;
  const open=sumOpen();
  $("#summary").hidden=!open;
  const bar=$("#sumBar");bar.setAttribute("aria-expanded",String(open));
  bar.innerHTML=`<span class="vals"><span class="pay">Zu bezahlen <b>${eur(pay)}</b></span><span class="exp">Erwartet <b>${eur(wP+wB)}</b></span></span><span class="chev">${open?"Weniger ▲":"Mehr ▼"}</span>`;
}

async function storeFile(blob,name){const id=uid();await dbPut("files",{id,blob,name,type:blob.type});return id}
async function fileUrl(id){const f=id&&await dbGet("files",id);return f?{url:URL.createObjectURL(f.blob),file:f}:null}
async function shrink(file,max,q){
  if(!file.type.startsWith("image/"))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",q));}catch{return file}
}
async function shareFile(id,title){
  const f=await dbGet("files",id);if(!f)return;
  const file=new File([f.blob],f.name||"beleg",{type:f.type});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title});}catch(e){}}
  else{const u=URL.createObjectURL(f.blob);const a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
}

// Kürzung: Widerspruch mit Frist und Ergebnis, oder akzeptieren
function objHtml(key,c){
  const s=c.s,o=s.obj;if(c.state!=="done"||(c.diff<=0.004&&!o))return "";
  const st=`class="status" style="margin:4px 0 0"`;
  if(o&&!o.result)return `<p ${st}><b>Widerspruch eingelegt am ${dfmt(o.date)}</b> · Ergebnis offen</p>
    <div class="sub-actions"><button type="button" class="btn link" data-act="objyes" data-k="${key}">Nachzahlung erhalten</button><button type="button" class="btn link" data-act="objno" data-k="${key}">Widerspruch abgelehnt</button></div>`;
  if(o)return `<p ${st}>Widerspruch vom ${dfmt(o.date)}: ${o.result==="nachzahlung"?"Nachzahlung erhalten":"abgelehnt"}</p>`;
  if(s.cutOk)return `<p ${st}>Kürzung akzeptiert</p>`;
  const base=s.proofDate||s.receivedDate,frist=key==="bh"&&base?addMonths(base,1):null,late=frist&&frist<today();
  return `<p ${st}>${frist?(late?`Widerspruchsfrist am ${dfmt(frist)} abgelaufen`:`<b style="color:var(--warn)">Widerspruch möglich bis ${dfmt(frist)}</b>`):"Kürzung offen"}</p>
    <div class="sub-actions"><button type="button" class="btn link" data-act="objset" data-k="${key}">Widerspruch eingelegt</button><button type="button" class="btn link" data-act="cutok" data-k="${key}">Kürzung akzeptieren</button></div>`;
}
function sideLine(key,title,inv){
  const c=side(inv,key);const s=c.s;let info="",btn="";
  if(c.state==="na")info="Kein Anspruch";
  else if(c.state==="todo"){info=`${eur(c.expected)} erwartet`;btn=`<button type="button" class="btn primary" data-act="sub" data-k="${key}">Heute eingereicht</button>`}
  else if(c.state==="wait"){info=`${eur(c.expected)} erwartet · eingereicht ${dfmt(s.submitted)}`+(c.waitDays>ASK_DAYS?`<br><b style="color:var(--warn)">Seit ${c.waitDays} Tagen keine Erstattung – bei ${key==="pkv"?"AXA":"der Beihilfe"} nachfragen</b>`:"");btn=`<button type="button" class="btn primary" data-act="ask" data-k="${key}">Geld eingegangen</button>`}
  else{info=`${eur(c.received)} erhalten am ${dfmt(s.receivedDate)}${c.diff>0.004?` · <b style="color:var(--bad)">${eur(c.diff)} weniger als erwartet</b>`:c.diff<-0.004?` · ${eur(-c.diff)} mehr als erwartet`:""}`;
    if(s.appId)info+=` · Antrag ${esc(s.appId)}`;
    if(s.eligible!=null)info+=`<br>${cutHtml(r2(inv.amount-s.eligible),s.cutNote,false,key)}`;
    if(c.review){info+=`<br><b style="color:var(--bad)">Leistungsnachweis prüfen</b>`;btn=`<button type="button" class="btn primary" data-act="checkok" data-k="${key}">Geprüft</button>`}}
  let ask="";
  if(S.edit.ask===key)ask=`<div class="inline"><label class="f">Erhaltener Betrag (€)<input id="askAmt" class="num" inputmode="decimal" value="${c.expected.toFixed(2).replace(".",",")}"></label>
    <button type="button" class="btn primary" data-act="got" data-k="${key}">Übernehmen</button></div>`;
  const proof=c.state==="na"?"":(s.proofUrl||s.proofFileId
    ?`<div class="sub-actions"><button type="button" class="btn link" data-act="proofopen" data-k="${key}">Leistungsnachweis öffnen</button></div>`
    :(c.state!=="todo"?`<div class="sub-actions"><button type="button" class="btn link" data-act="proofcap" data-k="${key}">Leistungsnachweis erfassen</button><button type="button" class="btn link" data-act="proofadd" data-k="${key}">nur ablegen</button></div>`:""));
  // Erneut einreichen: setzt die Seite auf Schritt 1 zurück (z. B. nach Ablehnung)
  let again="";
  if(c.state==="wait"||c.state==="done")again=S.edit.resub===key
    ?`<div class="inline"><span class="status" style="margin:0">Einreichung und Erstattung zurücksetzen?</span><button type="button" class="btn primary" data-act="resubok" data-k="${key}">Ja, erneut einreichen</button><button type="button" class="btn" data-act="resubno">Abbrechen</button></div>`
    :`<div class="sub-actions"><button type="button" class="btn link" data-act="resub" data-k="${key}">Erneut einreichen</button></div>`;
  return `<div class="line"><div><div class="t">${title}</div><div class="s">${info}</div></div>${S.edit.ask===key?"":btn}</div>${ask}${objHtml(key,c)}${proof}${again}`;
}

async function viewClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const inv=structuredClone(S.inv.find(x=>x.id===S.edit.id));const k=b.dataset.k;
  switch(b.dataset.act){
    case "close":return closeSheet();
    case "edit":{const urls=S.edit.urls;S.edit.urls=[];urls.forEach(u=>URL.revokeObjectURL(u));return openEditor(inv)}
    case "sub":inv[k].submitted=today();await saveInvoice(inv);toast((k==="pkv"?"PKV":"Beihilfe")+": heute eingereicht");return drawView();
    case "ask":S.edit.ask=k;drawView();$("#askAmt")?.focus();return;
    case "got":{const v=r2(String($("#askAmt").value).replace(/\./g,"").replace(",","."));inv[k].received=v;inv[k].receivedDate=today();if(!inv[k].submitted)inv[k].submitted=today();
      inv[k].checked=false;S.edit.ask=null;await saveInvoice(inv);toast("Geld eingegangen – jetzt Leistungsnachweis prüfen");return drawView()}
    case "resub":S.edit.resub=k;return drawView();
    case "resubno":S.edit.resub=null;return drawView();
    case "resubok":{const x=inv[k];
      const was=`Erste Einreichung ${dfmt(x.submitted)}`+(x.receivedDate?`, ${eur(+x.received||0)} am ${dfmt(x.receivedDate)}`:"");
      x.note=x.note?`${x.note} (${was})`:was;
      x.submitted=null;x.receivedDate=null;x.received="";delete x.checked;
      S.edit.resub=null;await saveInvoice(inv);toast((k==="pkv"?"PKV":"Beihilfe")+": wieder bei Schritt 1 Einreichen");return drawView()}
    case "checkok":inv[k].checked=true;await saveInvoice(inv);toast((k==="pkv"?"PKV":"Beihilfe")+": geprüft");return drawView();
    case "objset":inv[k].obj={date:today(),result:null};await saveInvoice(inv);toast("Widerspruch eingetragen");return drawView();

      const name=`${inv.invoiceDate||today()}_${inv.patient}_${k==="pkv"?"PKV":"Beihilfe"}_Leistungsnachweis`.replace(/[^\wäöüÄÖÜß.-]+/g,"_")+(blob.type==="application/pdf"?".pdf":".jpg");
      inv[k].proofFileId=await storeFile(blob,name);inv[k].proofDriveId=null;inv[k].proofUrl="";inv[k].proofShared=false;await saveInvoice(inv);toast("Leistungsnachweis gespeichert");return openView(inv.id)}

// IBAN mit früheren Rechnungen desselben Rechnungsstellers abgleichen
function checkKnownIban(){
  if(!S.edit?.conf)return;readForm();const inv=S.edit.inv;const name=(inv.provider||"").trim().toLowerCase();if(!name||!inv.iban)return drawConf();
  const known=[...new Set(S.inv.filter(x=>x.id!==inv.id&&(x.provider||"").trim().toLowerCase()===name&&x.iban).map(x=>x.iban))];
  const c=S.edit.conf.iban||(S.edit.conf.iban={lvl:"check"});
  if(known.includes(inv.iban)){if(c.lvl!=="ok"){c.lvl="ok";c.msg="Gleiche IBAN wie bei früheren Rechnungen."}}
  else if(known.length){c.lvl="warn";c.done=false;c.msg=`Weicht von früheren Rechnungen ab (bisher …${known[0].slice(-6)}). Bitte genau prüfen, ob der Arzt die Bankverbindung geändert hat.`}
  drawConf();
}
function suggestFromProvider(){
  readForm();const inv=S.edit.inv;const name=inv.provider.trim().toLowerCase();if(!name)return;
  const prev=S.inv.filter(x=>x.id!==inv.id&&(x.provider||"").trim().toLowerCase()===name).sort((a,b)=>(b.invoiceDate||"").localeCompare(a.invoiceDate||""));
  if(!prev.length)return;
  const filled=[];
  const ib=prev.find(x=>x.iban)?.iban;if(ib&&!$("#iban").value){$("#iban").value=ib;filled.push("IBAN")}
  const rs=prev.find(x=>x.reason)?.reason;if(rs&&!$("#reason").value){$("#reason").value=rs;filled.push("Grund")}
  const pats=[...new Set(prev.map(x=>x.patient).filter(Boolean))];
  if(!inv.id&&!S.edit.patientLocked&&pats.length===1&&S.settings.people.some(p=>p.name===pats[0])&&$("#patient").value!==pats[0]){
    $("#patient").value=pats[0];const r=rateFor(pats[0]);$("#pkv_rate").value=Math.round(r.pkv*100);$("#bh_rate").value=Math.round(r.bh*100);filled.push("Person")}
  readForm();refreshCalc();showDup();
  if(filled.length)setStatus(`Von der letzten Rechnung übernommen: ${filled.join(", ")}.`);
}
/* ---- Doppelte Rechnungen erkennen ---- */
const normNo=s=>String(s||"").replace(/[\s\/\-.]/g,"").toLowerCase();
function findDuplicate(inv){
  const no=normNo(inv.invoiceNo),prov=(inv.provider||"").trim().toLowerCase();
  return S.inv.find(x=>x.id!==inv.id&&(
    (no.length>=3&&normNo(x.invoiceNo)===no)||
    (prov&&inv.invoiceDate&&inv.amount!==""&&(x.provider||"").trim().toLowerCase()===prov&&x.invoiceDate===inv.invoiceDate&&r2(x.amount)===r2(inv.amount))));
}
function showDup(){
  const box=$("#dupBox");if(!box||!S.edit||S.edit.inv.id)return;
  const d=findDuplicate(S.edit.inv);S.edit.dup=d||null;
  box.innerHTML=d?`<div class="checkline" style="margin-top:10px">Diese Rechnung gibt es vermutlich schon: <b>${esc(d.provider)}</b>, ${dfmt(d.invoiceDate)}, ${eur(d.amount)} (${esc(d.patient)}${d.invoiceNo?", Nr. "+esc(d.invoiceNo):""}).
    <div class="btnrow" style="margin-top:8px"><button type="button" class="btn" data-act="dupopen">Vorhandene öffnen</button><button type="button" class="btn" data-act="dupsave">Trotzdem speichern</button></div></div>`:"";
}
function readForm(){
  const inv=S.edit.inv;const v=id=>$("#"+id)?.value??"";const n=id=>{const x=v(id).trim().replace(/\./g,"").replace(",",".");return x===""?"":r2(x)};
  const nn=id=>{const x=v(id).trim();if(x==="")return "";return r2(x.includes(",")?x.replace(/\./g,"").replace(",","."):x)};
  inv.patient=v("patient");inv.group=rateFor(inv.patient).group;
  inv.amount=nn("amount");
  for(const k of ["invoiceDate","receivedDate","provider","invoiceNo","reason","iban","note","dueDate"])inv[k]=v(k).trim();
  inv.kind=v("kind")||inv.kind||"";
  inv.iban=inv.iban.replace(/\s+/g,"").toUpperCase();
  for(const key of ["pkv","bh"]){const s=inv[key]=inv[key]||{};
    s.rate=r2((+nn(key+"_rate")||0)/100);s.deduction=nn(key+"_deduction")||0;
    s.submitted=v(key+"_submitted")||null;s.receivedDate=v(key+"_receivedDate")||null;s.received=nn(key+"_received");s.note=v(key+"_note").trim()}
  inv.payment={date:v("pay_date")||null,amount:nn("pay_amount")};
  if($("#fee"))inv.fee=nn("fee")||0;
}
function refreshCalc(){readForm();for(const key of ["pkv","bh"]){const el=$("#"+key+"_exp");if(el)el.textContent=eur(side(S.edit.inv,key).expected)}}
async function editClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="cancel"){const id=S.edit.inv.id;closeSheet();if(id)openView(id);return}
  if(act==="confok"){const x=S.edit.conf?.[b.dataset.f];if(x)x.done=true;return drawConf()}
  if(act==="dupopen"){const id=S.edit.dup?.id;closeSheet();if(id)openView(id);return}
  if(act==="dupsave"){S.edit.dupOk=true;$("#dupBox").innerHTML="";return editClick({target:$("#btnSave")})}
  if(act==="save"){
    readForm();const inv=S.edit.inv;
    if(inv.amount===""||!inv.provider){setStatus("Bitte mindestens Rechnungssteller und Betrag eintragen.",true);return}
    const pend=confPending();if(pend.length){drawConf();$("#confBox").scrollIntoView({block:"start",behavior:"smooth"});setStatus(`Bitte zuerst prüfen und bestätigen: ${pend.map(k=>CONF_LABEL[k]).join(", ")}.`,true);return}
    if(!inv.id&&!S.edit.dupOk&&findDuplicate(inv)){showDup();$("#dupBox").scrollIntoView({block:"center"});setStatus("Bitte prüfen: möglicherweise doppelt.",true);return}
    b.disabled=true;
    try{
      if(S.edit.file){const blob=await shrink(S.edit.file,2200,0.85);inv.docFileId=await storeFile(blob,fname(inv,blob));inv.docDriveId=null;inv.docUrl="";S.edit.file=null;
        if(S.edit.thumb0){inv.thumbFileId=await storeFile(await shrink(S.edit.thumb0,900,0.7),"vorschau.jpg")}}
      await saveInvoice(inv);toast("Gespeichert");const id=inv.id;closeSheet();openView(id);
    }catch(err){setStatus("Speichern fehlgeschlagen: "+(err?.message||err),true);b.disabled=false}
    return;
  }
  if(act==="del"){
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Wirklich löschen? Nochmal tippen";return}
    const inv=S.edit.inv;await dbDel("invoices",inv.id);if(inv.docFileId)await dbDel("files",inv.docFileId).catch(()=>{});
    S.deleted[inv.id]=new Date().toISOString();await dbPut("meta",{key:"deleted",items:S.deleted});
    await queueTrash(inv);
    S.inv=S.inv.filter(x=>x.id!==inv.id);render();closeSheet();toast("Rechnung gelöscht");scheduleSync();
  }
}

/* ================= Texterkennung auf dem Handy ================= */
const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tessWorker=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function ensureTess(){
  await loadScript(TESS);
  if(!tessWorker)tessWorker=await Tesseract.createWorker("deu",1,{logger:m=>{if(m.status==="recognizing text")setStatus(`Wird gelesen … ${Math.round(m.progress*100)} %`)}});
}
function loadLib(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function ocr(input){
  setStatus("Texterkennung startet … (beim ersten Mal etwas länger)");
  const qr=await readInvoiceQr(input).catch(()=>null);
  const isPdfText=!input.images&&(input.pdf||input.file)&&!(input.pdf||input.file).type?.startsWith("image/");
  try{
    S.ocrCap=[];let text;try{text=await readText(input)}finally{if(S.edit)S.edit.cap=S.ocrCap;S.ocrCap=null}
    if(!S.edit||S.edit.mode!=="edit")return;
    readForm();const got=parseInvoiceText(text||"",S.settings.people.map(p=>p.name),[...new Set(S.inv.map(i=>i.provider).filter(Boolean))]);
    const inv=S.edit.inv;const filled=[];
    if(got.amount!=null&&inv.amount===""){inv.amount=got.amount;filled.push("Betrag")}
    if(got.date){inv.invoiceDate=got.date;filled.push("Datum")}
    if(got.due&&!inv.dueDate){inv.dueDate=got.due;filled.push("Fälligkeit")}
    if(got.invoiceNo&&!inv.invoiceNo){inv.invoiceNo=got.invoiceNo;filled.push("Rechnungsnummer")}
    if(got.iban&&!inv.iban){inv.iban=got.iban;filled.push("IBAN")}
    if(got.provider&&!inv.provider){inv.provider=got.provider;filled.push("Rechnungssteller")}
    if(got.patient){S.edit.patientLocked=true;inv.patient=got.patient;const r=rateFor(got.patient);inv.group=r.group;inv.pkv.rate=r.pkv;inv.bh.rate=r.bh;filled.push("Person")}
    // GiroCode auf der Rechnung hat Vorrang: exakte Werte
    const conf={};
    if(qr){if(qr.amount!=null){inv.amount=qr.amount;conf.amount={lvl:"ok"}}if(qr.iban){inv.iban=qr.iban;conf.iban={lvl:"ok"}}
      if(qr.name&&!got.provider&&!inv.provider)inv.provider=qr.name;filled.unshift("QR-Code")}
    const pdfMsg=isPdfText?"Aus dem PDF-Text gelesen. Bitte kurz mit dem PDF vergleichen.":"";
    for(const k of ["amount","invoiceDate","invoiceNo"])if(!conf[k]&&inv[k]!==""&&inv[k]!=null&&(k!=="invoiceDate"||got.date))
      conf[k]={lvl:"check",msg:pdfMsg,crop:isPdfText?null:await cropFor(inv[k],k==="invoiceDate"?"date":k==="amount"?"amount":"no")};
    if(inv.iban&&!conf.iban)conf.iban={lvl:"check",msg:"IBAN-Prüfziffer stimmt. Bitte trotzdem vergleichen, der Arzt ist neu.",crop:isPdfText?null:await cropFor(inv.iban,"iban")};
    S.edit.conf=conf;
    drawEditor();
    if(inv.provider)suggestFromProvider();
    checkKnownIban();
    setStatus(filled.length?`Erkannt: ${filled.join(", ")}. Bitte prüfen.`:"Nichts sicher erkannt. Bitte Felder ausfüllen.");
  }catch(err){setStatus("Texterkennung nicht verfügbar (offline?). Bitte Felder ausfüllen.")}
}
/* ---- GiroCode auf der Rechnung lesen (Chrome: BarcodeDetector) ---- */
async function readInvoiceQr(input){
  if(!("BarcodeDetector" in window))return null;
  let det;try{det=new BarcodeDetector({formats:["qr_code"]})}catch{return null}
  const srcs=[];
  try{
    if(input.images)for(const im of input.images)srcs.push(await createImageBitmap(im));
    const f=input.pdf||input.file;
    if(f&&f.type?.startsWith("image/"))srcs.push(await createImageBitmap(f));
    else if(f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""))&&!input.images){
      await loadLib(PDFJS,()=>!!window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;

function parseGiro(raw){

async function cropFor(value,kind){
  const caps=S.edit?.cap||[];if(!caps.length||value==null||value==="")return null;
  const digits=x=>String(x).replace(/[^0-9]/g,"");
  let want;
  if(kind==="amount")want=digits(Number(value).toFixed(2));
  else if(kind==="date"){const [y,m,d]=String(value).split("-");want=[d+m+y,d+m+y.slice(2)]}
  else if(kind==="iban")want=String(value).slice(0,4).toLowerCase();
  else want=String(value).toLowerCase().replace(/[^0-9a-z]/g,"");
  for(const cap of caps){
    const hit=cap.words.find(w=>{const t=w.text.toLowerCase();
      if(kind==="amount")return digits(t)===want&&/[.,]\d{2}/.test(t);
      if(kind==="date")return want.includes(digits(t))&&digits(t).length>=6;
      if(kind==="iban")return t.replace(/[^0-9a-z]/g,"").startsWith(want);
      return want.length>=3&&t.replace(/[^0-9a-z]/g,"").includes(want)});
    if(!hit?.b)continue;
    const h=hit.b.y1-hit.b.y0,cy=(hit.b.y0+hit.b.y1)/2;
    const line=cap.words.filter(w=>w.b&&Math.abs((w.b.y0+w.b.y1)/2-cy)<h*0.7);
    const x0=Math.min(...line.map(w=>w.b.x0)),x1=Math.max(...line.map(w=>w.b.x1)),y0=Math.min(...line.map(w=>w.b.y0)),y1=Math.max(...line.map(w=>w.b.y1));
    try{const bmp=await createImageBitmap(cap.img);const pad=Math.round(h*0.8);
      const sx=Math.max(0,x0-pad),sy=Math.max(0,y0-pad),sw=Math.min(bmp.width,x1+pad)-sx,sh=Math.min(bmp.height,y1+pad)-sy;
      const sc=Math.min(1,900/sw);const cv=document.createElement("canvas");cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
      cv.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
      const bl=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));const u=URL.createObjectURL(bl);S.edit.urls.push(u);return u}catch{return null}
  }
  return null;
}

async function prepareForOcr(file){
  try{
    const bmp=await createImageBitmap(file);const sc=Math.min(1,2600/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,w,h);
    const bg=document.createElement("canvas");bg.width=w;bg.height=h;const bx=bg.getContext("2d",{willReadFrequently:true});
    bx.filter=`blur(${Math.round(Math.max(w,h)/80)}px)`;bx.drawImage(cv,0,0);
    const a=ctx.getImageData(0,0,w,h),b=bx.getImageData(0,0,w,h),d=a.data,e=b.data;
    if(e[0]===d[0]&&e[1]===d[1]&&e[w*4*Math.floor(h/2)]===d[w*4*Math.floor(h/2)]){} // Weichzeichnen evtl. nicht unterstützt
    for(let i=0;i<d.length;i+=4){
      const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2],bgv=Math.max(1,0.299*e[i]+0.587*e[i+1]+0.114*e[i+2]);

  }catch{return shrink(file,2000,0.9)}
}
// IBAN prüfen (Prüfziffer nach ISO 13616), typische Lesefehler korrigieren
function ibanOk(s){if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;
  const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+ +ch)%97;return m===1}
function findIban(t){
  const fix=s=>s.replace(/[Oo]/g,"0").replace(/[Il|!]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2");
  const cands=[];
  for(const m of t.matchAll(/IBAN[\s:.]*([A-Z]{2}[0-9OoIl|SBZ ]{18,34})/gi))cands.push(m[1]);
  for(const m of t.matchAll(/\b(DE[0-9OoIl| ]{20,30})/g))cands.push(m[1]);
  for(const c of cands){const raw=c.replace(/\s+/g,"");const cc=raw.slice(0,2).toUpperCase();
    for(let len=22;len<=Math.min(34,raw.length);len++){const iban=cc+fix(raw.slice(2,len));if(cc==="DE"&&len!==22)break;if(ibanOk(iban))return iban}}
  return null;
}
function parseInvoiceText(text,people,providers){
  const out={};const t=text.replace(/\r/g,"");
  const lines=t.split("\n").map(l=>l.trim()).filter(Boolean);
  const num=s=>r2(s.replace(/\s/g,"").replace(/\./g,"").replace(",","."));
  const amtRe=/(\d{1,3}(?:[.\s]\d{3})*,\d{2})/g;
  const keys=/(rechnungsbetrag|gesamtbetrag|endbetrag|zu zahlen|zahlbetrag|gesamtsumme|summe|gesamt|betrag)/i;
  let best=null;
  for(const l of lines){if(keys.test(l)){const m=[...l.matchAll(amtRe)];if(m.length){const v=num(m[m.length-1][1]);if(v>0&&(best===null||/zu zahlen|rechnungsbetrag|endbetrag|zahlbetrag/i.test(l)||v>best))best=v}}}
  if(best===null){const all=[...t.matchAll(amtRe)].map(m=>num(m[1])).filter(v=>v>0&&v<100000);if(all.length)best=Math.max(...all)}
  if(best!==null)out.amount=best;
  const dRe=/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/,dReG=/(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2}(?!\d))/g;
  const iso=m=>{let y=+m[3];if(y<100)y+=2000;const d=`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;return isNaN(new Date(d))||+m[2]>12||+m[1]>31?null:d};
  // Fälligkeit: "bis zum 28.11.2026", "zahlbar bis", "fällig am"
  const dueM=t.match(/(?:bis\s+(?:zum|spätestens)?|zahlbar\s+bis|fällig\s+(?:am|bis)?|zahlungsziel:?)\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i);
  if(dueM){const m=dueM[1].match(dRe);const d=m&&iso(m);if(d)out.due=d}
  // Rechnungsdatum: Bezeichnung in derselben oder der nächsten Zeile, sonst das späteste plausible Datum
  let date=null;
  for(let i=0;i<lines.length&&!date;i++){
    if(/(rechnungs|r\.?-|re\.?-)\s*datum|datum\s*der\s*rechnung|^datum\b/i.test(lines[i])){
      for(const l of [lines[i],lines[i+1]||""]){const ms=[...l.matchAll(dReG)].map(iso).filter(Boolean);if(ms.length){date=ms[ms.length-1];break}}
    }
  }
  if(!date){const now=today(),min=String(+now.slice(0,4)-2)+now.slice(4);
    const all=[...t.matchAll(dReG)].map(iso).filter(d=>d&&d<=now&&d>=min&&d!==out.due).sort();if(all.length)date=all[all.length-1]}
  if(date)out.date=date;
  // Rechnungsnummer: viele Schreibweisen, Wert in derselben oder der nächsten Zeile
  const label=/(rechnungs[\s-]*(?:nr|nummer|no)|r[\s.-]*(?:nr|nummer)|rg[\s.-]*nr|re[\s.-]*nr|beleg[\s-]*(?:nr|nummer))\.?/i;
  for(let i=0;i<lines.length&&!out.invoiceNo;i++){
    const l=lines[i],m=l.match(label);if(!m)continue;
    const after=l.slice(m.index+m[0].length).replace(/^[\s:./-]*/,"");
    const same=after.match(/^([A-Z0-9][A-Z0-9\/\-]{3,})/i);
    if(same&&/\d{3,}/.test(same[1])){out.invoiceNo=same[1].replace(/[\/-]$/,"");break}
    const next=(lines[i+1]||"").match(/([A-Z0-9][A-Z0-9\-]{3,})/gi)?.find(x=>/\d{4,}/.test(x));
    if(next&&!/^\d{1,2}\.\d{1,2}\./.test(next))out.invoiceNo=next;
  }
  const ib=findIban(t);if(ib)out.iban=ib;
  const low=t.toLowerCase();
  // Patient: zuerst eine Zeile mit "Patient", sonst ein anderer Name als der Empfänger (Antragsteller steht meist in der Anschrift)
  const has=(s,n)=>new RegExp("\\b"+n.toLowerCase()+"\\b").test(s.toLowerCase());
  const pl=lines.find(l=>/patient|behandelt|leistungsempf|^name\b/i.test(l)&&people.some(n=>has(l,n)));
  const found=people.filter(n=>has(low,n));
  const p=pl?people.find(n=>has(pl,n)):(found.find(n=>n!==people[0])||found[0]);
  if(p)out.patient=p;
  // Rechnungssteller: nur über unterscheidende Wörter erkennen (nicht über "Dr.", "med.", "GmbH" usw.)
  const STOP=new Set(["dr","med","prof","dipl","gmbh","ggmbh","mbh","mvz","co","kg","ag","ug","und","u","der","die","das","fuer","für","praxis","gemeinschaftspraxis","zentrum","ohg","gbr","e","v"]);
  const words=s=>s.toLowerCase().replace(/[^a-zäöüß0-9]+/g," ").split(" ").filter(w=>w.length>=4&&!STOP.has(w));
  const textWords=new Set(words(t));
  const hit=w=>textWords.has(w)||[...textWords].some(x=>x.length>w.length&&x.startsWith(w));
  let bestProv=null,bestScore=0;
  for(const pr of providers){const ws=[...new Set(words(pr))];if(!ws.length)continue;
    const n=ws.filter(hit).length;if(n<Math.min(2,ws.length))continue;
    const score=n/ws.length+n*0.01;if(score>bestScore){bestScore=score;bestProv=pr}}
  if(bestProv)out.provider=bestProv;
  else{ // unbekannter Rechnungssteller: Briefkopf in den ersten Zeilen
    const head=lines.slice(0,10).find(l=>/(gmbh|praxis|mvz|klinik|apotheke|labor|pvs|zahnarzt|dr\.\s*med)/i.test(l)&&!/herr|frau|str\.|straße|\d{5}/i.test(l));
    if(head)out.provider=head.replace(/[•·|].*$/,"").trim().slice(0,60);
  }
  return out;
}

// Blatt finden: hellste zusammenhängende Fläche (Otsu-Schwelle), Ecken über Extrempunkte
function detectQuad(src){

  for(let i=0;i<w*h;i++){if(g[i]<=th||lab[i])continue;cur++;let size=0;st.push(i);lab[i]=cur;
    while(st.length){const p=st.pop();size++;const px=p%w,py=(p/w)|0;
      for(const q of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1])if(q>=0&&!lab[q]&&g[q]>th){lab[q]=cur;st.push(q)}}

  if(bestSize<w*h*0.15)return full;

function warpQuad(src,quad){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=quad;

  const sc=Math.min(1,3200/Math.max(W,H));W=Math.max(10,Math.round(W*sc));H=Math.max(10,Math.round(H*sc));
  const sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let a,b,c,d,e,f,g=0,h=0;
  if(Math.abs(sx)<1e-6&&Math.abs(sy)<1e-6){a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0}

    a=x1-x0+g*x1;b=x3-x0+h*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0}

  const out=document.createElement("canvas");out.width=W;out.height=H;const oc=out.getContext("2d");const od=oc.createImageData(W,H),o=od.data;
  for(let j=0;j<H;j++){const v=j/(H-1);for(let i=0;i<W;i++){const u=i/(W-1),den=g*u+h*v+1;
    let X=(a*u+b*v+c)/den,Y=(d*u+e*v+f)/den;if(X<0)X=0;if(Y<0)Y=0;if(X>sw-1.001)X=sw-1.001;if(Y>shh-1.001)Y=shh-1.001;
    const xi=X|0,yi=Y|0,fx=X-xi,fy=Y-yi,p=(yi*sw+xi)*4,q=p+sw*4,t=(j*W+i)*4;
    for(let ch=0;ch<3;ch++){o[t+ch]=(sd[p+ch]*(1-fx)+sd[p+4+ch]*fx)*(1-fy)+(sd[q+ch]*(1-fx)+sd[q+4+ch]*fx)*fy}o[t+3]=255}}
  oc.putImageData(od,0,0);return out;
}

function enhanceScan(cv){

  const bg=document.createElement("canvas");bg.width=w;bg.height=h;const bx=bg.getContext("2d",{willReadFrequently:true});
  bx.filter=`blur(${Math.round(Math.max(w,h)/60)}px)`;bx.drawImage(cv,0,0);
  const a=ctx.getImageData(0,0,w,h),d=a.data,e=bx.getImageData(0,0,w,h).data;

const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";

async function tessRec(img){

  const d=res?.data||{};
  if(S.ocrCap){let words=d.words;if(!words?.length&&d.blocks)words=d.blocks.flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])));

async function docText(file){

    await loadLib(PDFJS,()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let text="";const pages=Math.min(pdf.numPages,6);
    for(let p=1;p<=pages;p++){
      const page=await pdf.getPage(p);const tc=await page.getTextContent();
      // Textstücke zu Zeilen zusammensetzen (gleiche Höhe)
      const rows=new Map();for(const it of tc.items){const y=Math.round(it.transform[5]);const r=rows.get(y)||[];r.push([it.transform[4],it.str]);rows.set(y,r)}
      let pt=[...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,r])=>r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ")).join("\n");
      if(pt.replace(/\s/g,"").length<40){ // gescanntes PDF: Seite als Bild lesen
        const vp=page.getViewport({scale:2.2});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        await ensureTess();const bl=await prepareForOcr(await new Promise(r=>cv.toBlob(r,"image/png")));pt=await tessRec(bl);
      }
      text+=pt+"\n";
    }
    return text;
  }
  await ensureTess();return await tessRec(await prepareForOcr(file));
}
const PSTOP=new Set(["dr","med","prof","dipl","gmbh","ggmbh","mbh","mvz","co","kg","ag","ug","und","der","die","das","fuer","für","praxis","gemeinschaftspraxis","zentrum","ohg","gbr"]);

function parseProofText(text){

  out.side=nb>np?"bh":np>0?"pkv":null;

  const iso=(d,m,y)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const MON={januar:1,februar:2,"märz":3,maerz:3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};

  if(dn)out.date=iso(dn[1],MON[dn[2].toLowerCase()],dn[3]);
  else if(dm)out.date=iso(dm[1],dm[2],dm[3]);
  else{const all=[...t.matchAll(/(\d{1,2})\.(\d{1,2})\.(\d{4})/g)].map(m=>iso(m[1],m[2],m[3])).filter(d=>d<=today()).sort();if(all.length)out.date=all[all.length-1]}
  for(const re of [/auszahlungsbetrag(?:\s+gesamt)?:?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i,/erstattungsbetrag\s+gesamt\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i,
    /(?:gesamterstattung|erstattung\s+gesamt|überweisungsbetrag|festgesetzte\s+beihilfe|beihilfe\s+gesamt|summe\s+beihilfe|gesamtbetrag\s+der\s+beihilfe|erstattungsbetrag|auszahlung)[^\d]{0,40}(\d{1,3}(?:\.\d{3})*,\d{2})/i]){

  const num=x=>r2(x.replace(/\./g,"").replace(",","."));

function matchInvoices(text,k,opt={}){
  const low=text.toLowerCase(),lines=text.split("\n");
  const tw=new Set(provWords(text));
  const amtRe=a=>{const f1=a.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\./g,"\\.?");return new RegExp("(?<![\\d.,])"+f1+"(?![\\d])")};
  const cands=[];
  for(const inv of S.inv){const s=side(inv,k);if(s.state==="na"||(s.state==="done"&&!s.review&&!opt.all))continue;
    const a=r2(inv.amount);let score=0,refund=null,eligible=null,hints=[];
    const re=a>0?amtRe(a):null;const li=re?lines.findIndex(l=>re.test(l)):-1;
    if(li>=0){score+=2;
      // Erstattung steht in derselben Zeile hinter dem Rechnungsbetrag; gleicher Betrag dahinter = abgelehnt
      const l=lines[li],m=l.match(re),rest=l.slice(m.index+m[0].length);const nums=[...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(x=>r2(x[1].replace(/\./g,"").replace(",",".")));
      if(k==="bh"&&nums.length>=2){ // Beihilfebescheid: erst beihilfefähiger Betrag, zuletzt Beihilfe, dahinter Hinweis-Nummern
        eligible=nums[0];refund=nums[nums.length-1];
        const all=[...rest.matchAll(/\d{1,3}(?:\.\d{3})*,\d{2}/g)];const last=all[all.length-1];
        hints=(rest.slice(last.index+last[0].length).match(/\b\d{1,2}\b/g)||[]);
      }
      else if(k==="pkv"&&nums.length>=2){ // AXA: Rechnungsbetrag, Ablehnungsbetrag, Erstattungsbetrag
        refund=nums[nums.length-1];if(nums[0]>0.004&&nums[0]<=a)eligible=r2(a-nums[0]);
      }
      else if(nums.length)refund=Math.abs(nums[0]-a)<0.005?0:nums[nums.length-1];
      else{ // Betrag steht allein (z. B. stationär): Summenzeile "Betrag Erstattung" in den nächsten Zeilen suchen
        for(let j=li+1;j<Math.min(lines.length,li+8);j++){const mm=lines[j].trim().match(new RegExp("^"+re.source+"\\s+(\\d{1,3}(?:\\.\\d{3})*,\\d{2})"));if(mm){refund=r2(mm[1].replace(/\./g,"").replace(",","."));break}}}}
    if(inv.invoiceDate){const [y,m,d]=inv.invoiceDate.split("-");if(text.includes(`${d}.${m}.${y}`)||text.includes(`${d}.${m}.${y.slice(2)}`))score+=2}
    const pw=provWords(inv.provider);if(pw.some(w=>tw.has(w)))score+=1;
    if(inv.patient&&low.includes(inv.patient.toLowerCase()))score+=0.5;
    if(score>=2)cands.push({id:inv.id,score,refund,eligible,hints,amount:a,amt:li>=0});
  }

  return cands.filter(c=>c.score>=3||(c.amt&&cands.filter(o=>o.amt&&o.amount===c.amount).length===1)).sort((a,b)=>b.score-a.score);
}

  if(!sel.length){setStatus("Bitte mindestens eine Rechnung auswählen.",true);return}
  btn.disabled=true;
  const blob=e.file.type.startsWith("image/")?await shrink(e.file,2200,0.85):e.file;
  const fid=await storeFile(blob,`${e.date}_${k==="pkv"?"PKV":"Beihilfe"}_Leistungsnachweis${blob.type==="application/pdf"?".pdf":".jpg"}`);
  for(const r of sel){
    const inv=structuredClone(S.inv.find(x=>x.id===r.id));if(!inv)continue;const s=inv[k]=inv[k]||{};
    if(!s.submitted)s.submitted=e.date;if(!r.already&&(!s.receivedDate||s.checked!==false))s.receivedDate=e.date;s.received=r2(r.amount);s.checked=true;
    if(e.appId)s.appId=e.appId;
    if(r.eligible!=null&&r.eligible<r2(inv.amount)-0.004){s.eligible=r.eligible;s.cutNote=r.note||""}else{delete s.eligible;delete s.cutNote}
    s.proofFileId=fid;s.proofDriveId=null;s.proofUrl="";s.proofFolder=null;s.proofName=null;s.proofShared=true;s.proofDate=e.date;
    await saveInvoice(inv);
  }
  closeSheet();toast(`Erstattung bei ${sel.length} Rechnung${sel.length===1?"":"en"} eingetragen`);
}

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function makeBackup(){
  try{
    const files=await dbAll("files");const packed=[];
    for(const f of files)packed.push({id:f.id,name:f.name,type:f.type,data:await blobToB64(f.blob)});
    const {lastBackup,...settings}=S.settings;
    const json=JSON.stringify({app:"arztrechnungen",version:1,createdAt:new Date().toISOString(),settings,invoices:S.inv,files:packed});
    const file=new File([json],`Arztrechnungen_Sicherung_${today()}.json`,{type:"application/json"});
    let done=false;
    if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:"Arztrechnungen Sicherung"});done=true}catch(e){if(e.name==="AbortError")return}}
    if(!done){const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
    S.settings.lastBackup=new Date().toISOString();await saveSettings();render();toast("Sicherung erstellt");
  }catch(err){toast("Sicherung fehlgeschlagen")}
}
async function restoreBackup(file){
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=="arztrechnungen"||!Array.isArray(d.invoices))throw new Error("Keine Sicherung dieser App");
    for(const f of d.files||[]){const bin=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));await dbPut("files",{id:f.id,name:f.name,type:f.type,blob:new Blob([bin],{type:f.type})})}
    // Fotos und Nachweise auf dem Gerät bleiben erhalten, auch wenn die Datei sie nicht enthält
    const local=new Map(S.inv.map(i=>[i.id,i]));
    for(const inv of d.invoices){
      const l=local.get(inv.id);
      if(l)for(const k of SLOTS){const ls=slot(l,k),ms=slot(inv,k);if(ls.fileId&&!ms.fileId&&(!ms.driveId||ms.driveId===ls.driveId))ms.fileId=ls.fileId}
      await dbPut("invoices",inv);
    }
    if(d.settings){const keep=Object.fromEntries(LOCAL_KEYS.map(k=>[k,S.settings[k]]));S.settings={...DEFAULT_SETTINGS,...d.settings,...keep};await saveSettings()}
    S.inv=await dbAll("invoices");closeSheet();render();toast(`${d.invoices.length} Rechnungen eingespielt`);scheduleSync();
  }catch(err){setStatus("Einspielen fehlgeschlagen: "+(err?.message||err),true)}
}

// Rückkehr von Google auswerten (Token steht im #-Teil der Adresse)
function readAuthRedirect(){
  if(!location.hash||!/access_token=|error=/.test(location.hash))return null;
  const h=new URLSearchParams(location.hash.slice(1));
  history.replaceState(null,"",location.pathname+location.search);
  let saved=null;try{saved=JSON.parse(localStorage.getItem("gstate")||"null");localStorage.removeItem("gstate")}catch{}
  if(h.get("error")){glog("Google meldet: "+h.get("error"));return {error:h.get("error"),silent:!!saved?.silent}}
  if(saved&&h.get("state")!==saved.state){glog("Rückkehr mit falscher Kennung");return {error:"state"}}
  glog("Rückkehr von Google: Zugang erhalten"+(saved?"":" (ohne gespeicherte Kennung)"));
  return {token:h.get("access_token"),expires:+h.get("expires_in")||3600};
}

  if(r.status===401){G.token=null;try{localStorage.removeItem("gtok")}catch{};const e=new Error("auth");e.code="auth";throw e}

}

async function findOrCreateFolder(name,parent){
  let query=`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;if(parent)query+=` and '${parent}' in parents`;
  const r=await (await gfetch(`${API}?q=${q(query)}&fields=files(id)&spaces=drive`)).json();
  if(r.files?.length)return r.files[0].id;
  const c=await (await gfetch(`${API}?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",...(parent?{parents:[parent]}:{})})})).json();

async function moveFile(id,target,name){

  let url=`${API}/${id}?fields=id,webViewLink&addParents=${target}`;if(remove)url+=`&removeParents=${remove}`;
  return (await gfetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(name?{name}:{})})).json();
}

async function ensureFolders(){

  if(s.driveFolderMap)for(const k of Object.keys(s.driveFolderMap))if(/^\/\d{4}(\/|$)/.test(k)){delete s.driveFolderMap[k];changed=true}
  if(!s.driveFolderId){s.driveFolderId=await findOrCreateFolder(FOLDER_NAME);changed=true}
  if(!s.driveAppId){s.driveAppId=await findOrCreateFolder("_App-Daten",s.driveFolderId);changed=true}
  if(!s.driveInboxId){s.driveInboxId=await findOrCreateFolder("Zum Einreichen",s.driveFolderId);changed=true}
  if(!s.driveDataId){
    let id=await findFile(DATA_NAME,s.driveAppId);
    if(!id){const old=await findFile(DATA_NAME,s.driveFolderId);if(old){await moveFile(old,s.driveAppId);id=old;glog("Datendatei nach _App-Daten verschoben")}}
    if(id){s.driveDataId=id;changed=true}

/* Foto -> PDF (eine A4-Seite), damit Beihilfe- und AXA-App die Datei auswählen können */
async function toPdf(blob){
  if(blob.type==="application/pdf")return blob;
  const bmp=await createImageBitmap(blob);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(bmp,0,0,w,h);
  const jpg=new Uint8Array(await (await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85))).arrayBuffer());
  return jpegToPdf(jpg,w,h);
}
function jpegToPdf(jpg,w,h){return jpegsToPdf([{jpg,w,h}])}
function jpegsToPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let pos=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);pos+=b.length};
  const pw=595.28,ph=841.89,n=pages.length;
  push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  const obj=(i,body)=>{off[i]=pos;push(`${i} 0 obj\n${body}\nendobj\n`)};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] /Count ${n} >>`);
  pages.forEach((p,i)=>{
    const po=3+i*3,io=po+1,co=po+2;
    const s=Math.min(pw/p.w,ph/p.h),dw=+(p.w*s).toFixed(2),dh=+(p.h*s).toFixed(2),x=+((pw-dw)/2).toFixed(2),y=+((ph-dh)/2).toFixed(2);
    const content=`q ${dw} 0 0 ${dh} ${x} ${y} cm /Im0 Do Q`;
    obj(po,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>`);
    off[io]=pos;push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /${p.gray?"DeviceGray":"DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);push(p.jpg);push("\nendstream\nendobj\n");
    obj(co,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });
  const total=3+n*3,xref=pos;let t=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  push(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
async function uploadMultipart(meta,blob,fileId){

  const url=fileId?`${UPLOAD}/${fileId}?uploadType=multipart&fields=id,webViewLink`:`${UPLOAD}?uploadType=multipart&fields=id,webViewLink`;
