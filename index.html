<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arztrechnungen</title>
<meta name="theme-color" content="#0d5f6b">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: mobile-first ledger — summary tiles, filter chips, stack of bill cards with stamp-style status marks; bottom sheet: short view first, details on demand */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e8ecf0; --line:#d5dce3;
  --ink:#16222e; --muted:#5b6b7a;
  --accent:#0d5f6b; --accent-ink:#ffffff;
  --ok:#1f7a45; --ok-soft:#dcefe3;
  --warn:#9a5b00; --warn-soft:#f7ead2;
  --bad:#b0322b; --bad-soft:#f6dedc;
  --wait:#3e5a9a; --wait-soft:#dfe6f5;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SFMono-Regular",Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --surface:#172129; --sunken:#1e2a34; --line:#2b3a46;
  --ink:#e6edf2; --muted:#93a4b3; --accent:#4fb3bf; --accent-ink:#06262b;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e2a54a; --warn-soft:#3a2c14;
  --bad:#f0827a; --bad-soft:#3d1d1b; --wait:#8fa9e6; --wait-soft:#1e2a45; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;margin:0;font-weight:700}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;font:inherit;color:inherit}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .val{font-family:var(--f-num);font-size:20px;font-weight:600}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile.hot .val,.tile.cut .val{color:var(--bad)} .tile.wait .val{color:var(--wait)} .tile.todo .val{color:var(--warn)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.searchinfo{font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0;flex:1}
.row1 .tick+.who{margin-left:2px}
.prov{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.amt{font-family:var(--f-num);font-weight:600;font-size:16px;white-space:nowrap}
.pchip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--ink);margin-right:6px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor;line-height:1.3;white-space:nowrap}
.stamp b{font-family:var(--f-num);font-weight:600;letter-spacing:0;text-transform:none}
.s-ok{color:var(--ok);background:var(--ok-soft)} .s-todo{color:var(--warn);background:var(--warn-soft)}
.s-wait{color:var(--wait);background:var(--wait-soft)} .s-bad{color:var(--bad);background:var(--bad-soft)}
.s-na{color:var(--muted);background:var(--sunken);border-style:dashed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.year{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:700;font-size:15.5px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5}
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-head{flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:18px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-num);font-size:28px;font-weight:600}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.line .t{font-weight:600}
.line .s{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input.num{font-family:var(--f-num)}
.calc{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--sunken);border-radius:9px;padding:8px 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn[disabled]{opacity:.55}
.thumb{width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--sunken)}
.status{font-size:13.5px;color:var(--muted)} .status.err{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.checkline{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13.5px}
#btnSettings{position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font:inherit;color:inherit;text-align:left}
.sumbar .vals{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;min-width:0}
.sumbar .vals b{font-family:var(--f-num);font-weight:600}
.sumbar .pay b{color:var(--bad)} .sumbar .exp b{color:var(--wait)}
.sumbar .chev{color:var(--muted);font-size:13px;white-space:nowrap}
.summary-wrap{display:flex;flex-direction:column;gap:10px}
.sub-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:-4px}
.next{font-size:13.5px;font-weight:600}
.next.s-einreichen{color:var(--warn)} .next.s-warten{color:var(--wait)} .next.s-ueberweisen{color:var(--accent)} .next.s-nachweis{color:var(--bad)}
.due{font-size:12.5px;color:var(--muted)} .due.warn{color:var(--warn);font-weight:600} .due.bad{color:var(--bad);font-weight:600}
.listtools{justify-content:flex-end}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tick{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selinfo{font-size:13.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.pchk{display:flex;gap:10px;align-items:flex-start;min-width:0;font-size:14px}
.pchk input{width:20px;height:20px;flex:none;margin-top:2px}
.scanwrap{display:flex;justify-content:center;margin:12px 0}
.scanwrap canvas{touch-action:none;border-radius:8px;max-width:100%;background:#000}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumbs img{width:84px;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.paygrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px}
.paygrid .k{color:var(--muted);font-size:12.5px}
.paygrid .v{overflow-wrap:anywhere;font-family:var(--f-num)}
.inline{display:flex;gap:8px;align-items:end}
.inline label{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Arztrechnungen</h1><p id="sub">Beihilfe und PKV im Blick</p></div>
    <button class="iconbtn" id="btnSettings" type="button">Einstellungen<span class="dot" id="settingsDot" hidden></span></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <button type="button" class="sumbar" id="sumBar" aria-expanded="false" aria-controls="summary"></button>
  <section class="summary" id="summary" aria-label="Übersicht" hidden></section>
  <div class="search" role="search"><input type="text" inputmode="search" id="q" placeholder="Suchen: Nummer, Betrag, Arzt, Person, Datum" aria-label="Rechnungen durchsuchen" autocomplete="off" enterkeyhint="search"><button type="button" id="qClear" aria-label="Suche leeren" hidden>×</button></div>
  <nav class="chips" id="filters" aria-label="Filter"></nav>
  <nav class="chips" id="people" aria-label="Personen"></nav>
  <section class="list" id="list" aria-live="polite"><div class="empty">Rechnungen werden geladen …</div></section>
</div>
<button class="fab" id="btnAdd" type="button">+ Rechnung</button>
<div class="selbar" id="selBar" hidden></div>
<input type="file" id="pick" accept="image/*,application/pdf" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pickBackup" accept="application/json,.json" hidden>
<div id="sheetHost"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ================= Speicher (IndexedDB, nur auf diesem Gerät) ================= */
const DB_NAME="arztrechnungen",DB_VER=1;
let _db;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains("invoices"))d.createObjectStore("invoices",{keyPath:"id"});
      if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"key"});};
    r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error);
  });
}
async function tx(store,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;
    const r=fn(s);if(r&&"onsuccess" in r)r.onsuccess=()=>out=r.result;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
}
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbGet=(s,k)=>tx(s,"readonly",st=>st.get(k));
const dbPut=(s,v)=>tx(s,"readwrite",st=>st.put(v));
const dbDel=(s,k)=>tx(s,"readwrite",st=>st.delete(k));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= Zustand ================= */
const DEFAULT_SETTINGS={
  people:[{name:"Olgun",group:"A"},{name:"Pinar",group:"E"},{name:"Ikra",group:"K"},{name:"Hamza",group:"K"}],
  rates:{A:{pkv:0.3,bh:0.7},E:{pkv:0.3,bh:0.7},K:{pkv:0.2,bh:0.8}},
  minBeihilfe:200,payDays:30,warnDays:7,lastBackup:null
};
const GROUPS={A:"Antragsteller",E:"Ehepartner",K:"Kind"};
const S={inv:[],deleted:{},settings:structuredClone(DEFAULT_SETTINGS),loaded:false,filter:"einreichen",person:"alle",edit:null,select:null,q:""};
/* Suche: Rechnungsnummer, Betrag (106,45 / 106.45 / 106), Rechnungssteller, Person, Grund, Notiz, Datum */
function matchQ(i,q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;
  const amt=+i.amount||0;const amtTxt=[amt.toFixed(2).replace(".",","),amt.toFixed(2),eur(amt).toLowerCase(),String(amt)].join(" ");
  const hay=[i.provider,i.invoiceNo,(i.invoiceNo||"").replace(/[^0-9a-z]/gi,""),i.patient,i.reason,i.note,dfmt(i.invoiceDate),dfmt(i.receivedDate),i.invoiceDate,amtTxt].join(" ").toLowerCase();
  return words.every(w=>{
    if(/^\d+([.,]\d{1,2})?$/.test(w)&&/[.,]/.test(w)){const n=+w.replace(",",".");if(Math.abs(n-amt)<0.005)return true}
    return hay.includes(w)||hay.includes(w.replace(/[^0-9a-z]/gi,""))&&w.replace(/[^0-9a-z]/gi,"").length>=3;
  });
}

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>(+n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dfmt=s=>{if(!s)return "";const [y,m,d]=s.split("-");return d+"."+m+"."+y};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ================= Berechnung ================= */
function side(inv,key){
  const s=inv[key]||{};const rate=+s.rate||0;const amount=+inv.amount||0;
  const expected=rate>0?r2(amount*rate-(+s.deduction||0)):0;
  let state;
  if(rate<=0)state="na"; else if(!s.submitted)state="todo"; else if(!s.receivedDate)state="wait"; else state="done";
  const received=state==="done"?r2(s.received):0;
  const diff=state==="done"?r2(expected-received):0;
  // Geld eingegangen, Leistungsnachweis noch nicht geprüft (ältere Einträge ohne Angabe gelten als geprüft)
  const review=state==="done"&&s.checked===false;
  return {rate,expected,state,received,diff,review,s};
}
function calc(inv){
  const amount=r2(inv.amount),paid=r2(inv.payment?.amount),open=r2(amount-paid);
  const pkv=side(inv,"pkv"),bh=side(inv,"bh");
  const unpaid=open>0.004;
  const age=inv.receivedDate?days(inv.receivedDate,today()):0;
  const due=dueDate(inv);
  const daysLeft=due?days(today(),due):null;
  const overdue=unpaid&&daysLeft!==null&&daysLeft<0;
  const dueSoon=unpaid&&daysLeft!==null&&daysLeft>=0&&daysLeft<=(+S.settings.warnDays||7);
  const cut=(pkv.diff>0.004?pkv.diff:0)+(bh.diff>0.004?bh.diff:0);
  const todo=pkv.state==="todo"||bh.state==="todo";
  const wait=pkv.state==="wait"||bh.state==="wait";
  const review=pkv.review||bh.review;
  const step=todo?"einreichen":wait?"warten":review?"nachweis":unpaid?"ueberweisen":"erledigt";
  return {amount,paid,open,unpaid,overdue,dueSoon,due,daysLeft,age,pkv,bh,cut,todo,wait,review,step,done:step==="erledigt",check:!!inv.check||cut>0.004};
}
// Fälligkeit: eigenes Datum von der Rechnung, sonst Eingang + Zahlungsfrist
function dueDate(inv){
  if(inv.dueDate)return inv.dueDate;
  const base=inv.receivedDate||inv.invoiceDate;if(!base)return null;
  const d=new Date(base+"T12:00:00");d.setDate(d.getDate()+(+S.settings.payDays||30));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Schritte wie im echten Ablauf: einreichen -> auf Erstattung warten -> überweisen -> erledigt
const FILTERS=[
  {id:"einreichen",label:"1 Einreichen",test:c=>c.step==="einreichen"},
  {id:"warten",label:"2 Warten",test:c=>c.step==="warten"},
  {id:"nachweis",label:"3 Nachweis prüfen",test:c=>c.step==="nachweis"},
  {id:"ueberweisen",label:"4 Überweisen",test:c=>c.step==="ueberweisen"},
  {id:"erledigt",label:"Erledigt",test:c=>c.step==="erledigt"},
  {id:"pruefen",label:"Prüfen",test:c=>c.check},
  {id:"alle",label:"Alle",test:()=>true},
  {id:"zahlen",label:"Unbezahlt",test:c=>c.unpaid,hidden:true},
  {id:"faellig",label:"Fällig",test:c=>c.dueSoon||c.overdue,hidden:true}
];
function nextStepText(i,c){
  if(c.step==="einreichen"){const w=[c.pkv.state==="todo"&&"PKV",c.bh.state==="todo"&&"Beihilfe"].filter(Boolean);return `Einreichen bei ${w.join(" und ")}`}
  if(c.step==="warten"){const w=[c.pkv.state==="wait"&&`PKV ${eur(c.pkv.expected)}`,c.bh.state==="wait"&&`Beihilfe ${eur(c.bh.expected)}`].filter(Boolean);return `Warten auf ${w.join(" und ")}`}
  if(c.step==="nachweis"){const w=[["PKV",c.pkv],["Beihilfe",c.bh]].filter(([,x])=>x.review).map(([n,x])=>x.diff>0.004?`${n} ${eur(x.received)} statt ${eur(x.expected)}`:`${n} ${eur(x.received)}`);return `Nachweis prüfen: ${w.join(", ")}`}
  if(c.step==="ueberweisen")return `Jetzt ${eur(c.open)} überweisen`;
  return "";
}
function dueText(c){
  if(!c.unpaid||!c.due)return "";
  if(c.overdue)return `<span class="due bad">Fällig seit ${dfmt(c.due)} (${-c.daysLeft} Tg. überfällig)</span>`;
  if(c.dueSoon)return `<span class="due warn">Fällig am ${dfmt(c.due)} (${c.daysLeft===0?"heute":"in "+c.daysLeft+" Tg."})</span>`;
  return `<span class="due">Fällig am ${dfmt(c.due)}</span>`;
}

  const emptyTxt={einreichen:"Nichts einzureichen.",warten:"Keine offenen Erstattungen.",nachweis:"Keine Nachweise zu prüfen.",ueberweisen:"Nichts zu überweisen.",erledigt:"Noch nichts erledigt."}[f.id]||"Keine Rechnungen in dieser Ansicht.";

    :`<button type="button" class="btn" data-act="selstart">Mehrere auswählen</button>`}</div>`;
  if(!q&&["warten","nachweis","alle"].includes(f.id)&&!S.select)html+=`<div class="btnrow listtools"><button type="button" class="btn" data-act="proofstart">Leistungsnachweis erfassen</button></div>`;
  if(!list.length){L.innerHTML=html+`<div class="empty">${q?"Keine Treffer.":emptyTxt}</div>`;return}
  let lastYear=null;

    const sel=S.select?S.select.has(i.id):null;

      <div class="amt">${eur(c.amount)}</div></div>
      ${nx?`<div class="next s-${c.step}">${esc(nx)}</div>`:""}
      ${dueText(c)}
      <div class="stamps">${stampPay(c)}${stampSide("PKV",c.pkv)}${stampSide("Beihilfe",c.bh)}${i.check?`<span class="stamp s-todo">Prüfen</span>`:""}</div>

}

function renderSelectBar(){

    <button type="button" class="btn primary" data-act="bulk" data-k="both" ${n?"":"disabled"}>Beiden</button></div>`;

async function bulkSubmit(which){
  const keys=which==="both"?["pkv","bh"]:[which];let n=0;
  for(const id of S.select){
    const inv=structuredClone(S.inv.find(x=>x.id===id));if(!inv)continue;let ch=false;
    for(const k of keys){const s=side(inv,k);if(s.state==="todo"){inv[k].submitted=today();ch=true}}
    if(ch){await saveInvoice(inv);n++}
  }
  S.select=null;render();toast(`${n} Rechnung${n===1?"":"en"} als eingereicht markiert`);
}
function stampPay(c){
  if(!c.unpaid)return c.open<-0.004?`<span class="stamp s-bad">Überzahlt <b>${eur(-c.open)}</b></span>`:`<span class="stamp s-ok">Bezahlt</span>`;
  return `<span class="stamp ${c.overdue?"s-bad":"s-todo"}">Zahlen <b>${eur(c.open)}</b>${c.overdue?` · ${c.age} Tg.`:""}</span>`;
}
function stampSide(n,s){
  if(s.state==="na")return `<span class="stamp s-na">${n} –</span>`;
  if(s.state==="todo")return `<span class="stamp s-todo">${n} einreichen</span>`;
  if(s.state==="wait")return `<span class="stamp s-wait">${n} <b>${eur(s.expected)}</b> erwartet</span>`;
  if(s.review)return `<span class="stamp s-bad">${n} Nachweis prüfen</span>`;
  if(s.diff>0.004)return `<span class="stamp s-bad">${n} gekürzt <b>−${eur(s.diff)}</b></span>`;
  return `<span class="stamp s-ok">${n} erstattet</span>`;
}
function renderSummary(rows){
  let pay=0,payN=0,over=0,wP=0,wB=0,todoN=0,todoB=0,cut=0,cutN=0;
  for(const {c} of rows){
    if(c.unpaid){pay+=c.open;payN++;if(c.overdue)over++}
    if(c.pkv.state==="wait")wP+=c.pkv.expected;
    if(c.bh.state==="wait")wB+=c.bh.expected;
    if(c.todo)todoN++;
    if(c.bh.state==="todo")todoB+=c.bh.expected;
    if(c.cut>0.004){cut+=c.cut;cutN++}
  }
  const min=+S.settings.minBeihilfe||0;
  const bhHint=todoB<=0?"Nichts offen für die Beihilfe":(todoB>=min?`Beihilfe ${eur(todoB)} – Mindestsumme erreicht`:`Beihilfe ${eur(todoB)}, noch ${eur(min-todoB)} bis ${eur(min)}`);
  $("#summary").innerHTML=`
   <button type="button" class="tile hot" data-f="zahlen"><span class="lbl">Zu bezahlen</span><span class="val">${eur(pay)}</span><span class="sub">${payN} Rechnung${payN===1?"":"en"}${over?` · ${over} überfällig`:""}</span></button>
   <button type="button" class="tile wait" data-f="warten"><span class="lbl">Erstattung erwartet</span><span class="val">${eur(wP+wB)}</span><span class="sub">PKV ${eur(wP)} · Beihilfe ${eur(wB)}</span></button>
   <button type="button" class="tile todo" data-f="einreichen"><span class="lbl">Noch einreichen</span><span class="val">${todoN}</span><span class="sub">${esc(bhHint)}</span></button>
   <button type="button" class="tile cut" data-f="pruefen"><span class="lbl">Gekürzt</span><span class="val">${eur(cut)}</span><span class="sub">${cutN} Rechnung${cutN===1?"":"en"} mit Differenz</span></button>`;
  $("#sub").textContent=`${S.inv.length} Rechnungen · ${S.settings.people.map(p=>p.name).join(", ")}`;
  const open=sumOpen();
  $("#summary").hidden=!open;
  const bar=$("#sumBar");bar.setAttribute("aria-expanded",String(open));
  bar.innerHTML=`<span class="vals"><span class="pay">Zu bezahlen <b>${eur(pay)}</b></span><span class="exp">Erwartet <b>${eur(wP+wB)}</b></span></span><span class="chev">${open?"Weniger ▲":"Mehr ▼"}</span>`;
}

document.addEventListener("click",e=>{
  if(e.target.closest(".sheet"))return;
  const f=e.target.closest("[data-f]");if(f){S.filter=f.dataset.f;S.select=null;if(S.q){S.q="";$("#q").value="";$("#qClear").hidden=true}render();return}
  const p=e.target.closest("[data-p]");if(p){S.person=p.dataset.p;render();return}
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="selstart"){S.select=new Set();render();return}
    if(act==="selnone"){S.select=null;render();return}
    if(act==="selall"){S.select=new Set([...document.querySelectorAll(".card[data-id]")].map(x=>x.dataset.id));render();return}
    if(act==="bulk"){bulkSubmit(a.dataset.k);return}
    if(act==="proofstart"){startProof();return}
  }
  const c=e.target.closest(".card[data-id]");
  if(c){const id=c.dataset.id;
    if(S.select){S.select.has(id)?S.select.delete(id):S.select.add(id);render();return}
    if(S.inv.some(x=>x.id===id))openView(id);return}
  if(e.target.closest("[data-act='backup']"))makeBackup();
});

async function saveInvoice(inv){
  inv.updatedAt=new Date().toISOString();if(!inv.id){inv.id=uid();inv.createdAt=inv.updatedAt}
  await dbPut("invoices",inv);
  const i=S.inv.findIndex(x=>x.id===inv.id);if(i>=0)S.inv[i]=inv;else S.inv.push(inv);render();
  scheduleSync();

async function storeFile(blob,name){const id=uid();await dbPut("files",{id,blob,name,type:blob.type});return id}
async function fileUrl(id){const f=id&&await dbGet("files",id);return f?{url:URL.createObjectURL(f.blob),file:f}:null}
async function shrink(file,max,q){
  if(!file.type.startsWith("image/"))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",q));}catch{return file}
}
async function shareFile(id,title){
  const f=await dbGet("files",id);if(!f)return;
  const file=new File([f.blob],f.name||"beleg",{type:f.type});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title});}catch(e){}}
  else{const u=URL.createObjectURL(f.blob);const a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
}

}

async function openView(id){
  const inv=S.inv.find(x=>x.id===id);if(!inv)return;
  S.edit={mode:"view",id,urls:[],ask:null};
  let thumb="";
  if(inv.docFileId){const r=await fileUrl(inv.docFileId);if(r){S.edit.urls.push(r.url);
    thumb=r.file.type.startsWith("image/")?`<img class="thumb" src="${r.url}" alt="Rechnungsfoto">`:""}}
  if(!thumb&&inv.thumbFileId){const r=await fileUrl(inv.thumbFileId);if(r){S.edit.urls.push(r.url);thumb=`<img class="thumb" src="${r.url}" alt="Rechnung">`}}
  drawView(thumb);
  // Foto aus Drive nachladen, wenn es nur dort liegt (z. B. auf einem anderen Gerät aufgenommen)
  if(!inv.docFileId&&inv.docDriveId&&tokenValid()){
    const blob=await driveBlob(inv.docDriveId);
    if(blob&&S.edit?.id===id&&blob.type.startsWith("image/")){
      const u=URL.createObjectURL(blob);S.edit.urls.push(u);drawView(`<img class="thumb" src="${u}" alt="Rechnungsfoto">`);
      const fid=await storeFile(blob,fname(inv,blob));const cur=S.inv.find(x=>x.id===id);if(cur){cur.docFileId=fid;await dbPut("invoices",cur)}
    }
  }
}
function sideLine(key,title,inv){
  const c=side(inv,key);const s=c.s;let info="",btn="";
  if(c.state==="na")info="Kein Anspruch";
  else if(c.state==="todo"){info=`${eur(c.expected)} erwartet`;btn=`<button type="button" class="btn primary" data-act="sub" data-k="${key}">Heute eingereicht</button>`}
  else if(c.state==="wait"){info=`${eur(c.expected)} erwartet · eingereicht ${dfmt(s.submitted)}`;btn=`<button type="button" class="btn primary" data-act="ask" data-k="${key}">Geld eingegangen</button>`}
  else{info=`${eur(c.received)} erhalten am ${dfmt(s.receivedDate)}${c.diff>0.004?` · <b style="color:var(--bad)">${eur(c.diff)} weniger als erwartet</b>`:c.diff<-0.004?` · ${eur(-c.diff)} mehr als erwartet`:""}`;
    if(c.review){info+=`<br><b style="color:var(--bad)">Leistungsnachweis prüfen</b>`;btn=`<button type="button" class="btn primary" data-act="checkok" data-k="${key}">Geprüft</button>`}}
  let ask="";
  if(S.edit.ask===key)ask=`<div class="inline"><label class="f">Erhaltener Betrag (€)<input id="askAmt" class="num" inputmode="decimal" value="${c.expected.toFixed(2).replace(".",",")}"></label>
    <button type="button" class="btn primary" data-act="got" data-k="${key}">Übernehmen</button></div>`;
  const proof=c.state==="na"?"":(s.proofUrl||s.proofFileId
    ?`<div class="sub-actions"><button type="button" class="btn link" data-act="proofopen" data-k="${key}">Leistungsnachweis öffnen</button></div>`
    :(c.state!=="todo"?`<div class="sub-actions"><button type="button" class="btn link" data-act="proofcap" data-k="${key}">Leistungsnachweis erfassen</button><button type="button" class="btn link" data-act="proofadd" data-k="${key}">nur ablegen</button></div>`:""));
  // Erneut einreichen: setzt die Seite auf Schritt 1 zurück (z. B. nach Ablehnung)
  let again="";
  if(c.state==="wait"||c.state==="done")again=S.edit.resub===key
    ?`<div class="inline"><span class="status" style="margin:0">Einreichung und Erstattung zurücksetzen?</span><button type="button" class="btn primary" data-act="resubok" data-k="${key}">Ja, erneut einreichen</button><button type="button" class="btn" data-act="resubno">Abbrechen</button></div>`
    :`<div class="sub-actions"><button type="button" class="btn link" data-act="resub" data-k="${key}">Erneut einreichen</button></div>`;
  return `<div class="line"><div><div class="t">${title}</div><div class="s">${info}</div></div>${S.edit.ask===key?"":btn}</div>${ask}${proof}${again}`;
}

/* Foto für die Texterkennung vorbereiten: Graustufen, Schatten ausgleichen (Bild durch weichgezeichneten Hintergrund teilen) */
async function prepareForOcr(file){
  try{
    const bmp=await createImageBitmap(file);const sc=Math.min(1,2600/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,w,h);
    const bg=document.createElement("canvas");bg.width=w;bg.height=h;const bx=bg.getContext("2d",{willReadFrequently:true});
    bx.filter=`blur(${Math.round(Math.max(w,h)/80)}px)`;bx.drawImage(cv,0,0);
    const a=ctx.getImageData(0,0,w,h),b=bx.getImageData(0,0,w,h),d=a.data,e=b.data;
    if(e[0]===d[0]&&e[1]===d[1]&&e[w*4*Math.floor(h/2)]===d[w*4*Math.floor(h/2)]){} // Weichzeichnen evtl. nicht unterstützt
    for(let i=0;i<d.length;i+=4){
      const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2],bgv=Math.max(1,0.299*e[i]+0.587*e[i+1]+0.114*e[i+2]);
      const v=Math.min(255,g/bgv*255);d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(a,0,0);
    return await new Promise(r=>cv.toBlob(x=>r(x||file),"image/png"));
  }catch{return shrink(file,2000,0.9)}
}
// IBAN prüfen (Prüfziffer nach ISO 13616), typische Lesefehler korrigieren
function ibanOk(s){if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;
  const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+ +ch)%97;return m===1}
function findIban(t){
  const fix=s=>s.replace(/[Oo]/g,"0").replace(/[Il|!]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2");
  const cands=[];
  for(const m of t.matchAll(/IBAN[\s:.]*([A-Z]{2}[0-9OoIl|SBZ ]{18,34})/gi))cands.push(m[1]);
  for(const m of t.matchAll(/\b(DE[0-9OoIl| ]{20,30})/g))cands.push(m[1]);
  for(const c of cands){const raw=c.replace(/\s+/g,"");const cc=raw.slice(0,2).toUpperCase();
    for(let len=22;len<=Math.min(34,raw.length);len++){const iban=cc+fix(raw.slice(2,len));if(cc==="DE"&&len!==22)break;if(ibanOk(iban))return iban}}
  return null;
}
function parseInvoiceText(text,people,providers){
  const out={};const t=text.replace(/\r/g,"");
  const lines=t.split("\n").map(l=>l.trim()).filter(Boolean);
  const num=s=>r2(s.replace(/\s/g,"").replace(/\./g,"").replace(",","."));
  const amtRe=/(\d{1,3}(?:[.\s]\d{3})*,\d{2})/g;
  const keys=/(rechnungsbetrag|gesamtbetrag|endbetrag|zu zahlen|zahlbetrag|gesamtsumme|summe|gesamt|betrag)/i;
  let best=null;
  for(const l of lines){if(keys.test(l)){const m=[...l.matchAll(amtRe)];if(m.length){const v=num(m[m.length-1][1]);if(v>0&&(best===null||/zu zahlen|rechnungsbetrag|endbetrag|zahlbetrag/i.test(l)||v>best))best=v}}}
  if(best===null){const all=[...t.matchAll(amtRe)].map(m=>num(m[1])).filter(v=>v>0&&v<100000);if(all.length)best=Math.max(...all)}
  if(best!==null)out.amount=best;
  const dRe=/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/,dReG=/(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2}(?!\d))/g;
  const iso=m=>{let y=+m[3];if(y<100)y+=2000;const d=`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;return isNaN(new Date(d))||+m[2]>12||+m[1]>31?null:d};
  // Fälligkeit: "bis zum 28.11.2026", "zahlbar bis", "fällig am"
  const dueM=t.match(/(?:bis\s+(?:zum|spätestens)?|zahlbar\s+bis|fällig\s+(?:am|bis)?|zahlungsziel:?)\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i);
  if(dueM){const m=dueM[1].match(dRe);const d=m&&iso(m);if(d)out.due=d}
  // Rechnungsdatum: Bezeichnung in derselben oder der nächsten Zeile, sonst das späteste plausible Datum
  let date=null;
  for(let i=0;i<lines.length&&!date;i++){
    if(/(rechnungs|r\.?-|re\.?-)\s*datum|datum\s*der\s*rechnung|^datum\b/i.test(lines[i])){
      for(const l of [lines[i],lines[i+1]||""]){const ms=[...l.matchAll(dReG)].map(iso).filter(Boolean);if(ms.length){date=ms[ms.length-1];break}}
    }
  }
  if(!date){const now=today(),min=String(+now.slice(0,4)-2)+now.slice(4);
    const all=[...t.matchAll(dReG)].map(iso).filter(d=>d&&d<=now&&d>=min&&d!==out.due).sort();if(all.length)date=all[all.length-1]}
  if(date)out.date=date;
  // Rechnungsnummer: viele Schreibweisen, Wert in derselben oder der nächsten Zeile
  const label=/(rechnungs[\s-]*(?:nr|nummer|no)|r[\s.-]*(?:nr|nummer)|rg[\s.-]*nr|re[\s.-]*nr|beleg[\s-]*(?:nr|nummer))\.?/i;
  for(let i=0;i<lines.length&&!out.invoiceNo;i++){
    const l=lines[i],m=l.match(label);if(!m)continue;
    const after=l.slice(m.index+m[0].length).replace(/^[\s:./-]*/,"");
    const same=after.match(/^([A-Z0-9][A-Z0-9\/\-]{3,})/i);
    if(same&&/\d{3,}/.test(same[1])){out.invoiceNo=same[1].replace(/[\/-]$/,"");break}
    const next=(lines[i+1]||"").match(/([A-Z0-9][A-Z0-9\-]{3,})/gi)?.find(x=>/\d{4,}/.test(x));
    if(next&&!/^\d{1,2}\.\d{1,2}\./.test(next))out.invoiceNo=next;
  }
  const ib=findIban(t);if(ib)out.iban=ib;
  const low=t.toLowerCase();
  // Patient: zuerst eine Zeile mit "Patient", sonst ein anderer Name als der Empfänger (Antragsteller steht meist in der Anschrift)
  const has=(s,n)=>new RegExp("\\b"+n.toLowerCase()+"\\b").test(s.toLowerCase());
  const pl=lines.find(l=>/patient|behandelt|leistungsempf|^name\b/i.test(l)&&people.some(n=>has(l,n)));
  const found=people.filter(n=>has(low,n));
  const p=pl?people.find(n=>has(pl,n)):(found.find(n=>n!==people[0])||found[0]);
  if(p)out.patient=p;
  // Rechnungssteller: nur über unterscheidende Wörter erkennen (nicht über "Dr.", "med.", "GmbH" usw.)
  const STOP=new Set(["dr","med","prof","dipl","gmbh","ggmbh","mbh","mvz","co","kg","ag","ug","und","u","der","die","das","fuer","für","praxis","gemeinschaftspraxis","zentrum","ohg","gbr","e","v"]);
  const words=s=>s.toLowerCase().replace(/[^a-zäöüß0-9]+/g," ").split(" ").filter(w=>w.length>=4&&!STOP.has(w));
  const textWords=new Set(words(t));
  const hit=w=>textWords.has(w)||[...textWords].some(x=>x.length>w.length&&x.startsWith(w));
  let bestProv=null,bestScore=0;
  for(const pr of providers){const ws=[...new Set(words(pr))];if(!ws.length)continue;
    const n=ws.filter(hit).length;if(n<Math.min(2,ws.length))continue;
    const score=n/ws.length+n*0.01;if(score>bestScore){bestScore=score;bestProv=pr}}
  if(bestProv)out.provider=bestProv;
  else{ // unbekannter Rechnungssteller: Briefkopf in den ersten Zeilen
    const head=lines.slice(0,10).find(l=>/(gmbh|praxis|mvz|klinik|apotheke|labor|pvs|zahnarzt|dr\.\s*med)/i.test(l)&&!/herr|frau|str\.|straße|\d{5}/i.test(l));
    if(head)out.provider=head.replace(/[•·|].*$/,"").trim().slice(0,60);
  }
  return out;
}

// Blatt finden: hellste zusammenhängende Fläche (Otsu-Schwelle), Ecken über Extrempunkte
function detectQuad(src){

    while(st.length){const p=st.pop();size++;const px=p%w,py=(p/w)|0;
      for(const q of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1])if(q>=0&&!lab[q]&&g[q]>th){lab[q]=cur;st.push(q)}}
    if(size>bestSize){bestSize=size;bestLab=cur}}

  if(bestSize<w*h*0.15)return full;

// Perspektive entzerren (Quadrat -> Viereck, Heckbert), bilinear abtasten
function warpQuad(src,quad){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=quad;
  let W=Math.max(Math.hypot(x1-x0,y1-y0),Math.hypot(x2-x3,y2-y3)),H=Math.max(Math.hypot(x3-x0,y3-y0),Math.hypot(x2-x1,y2-y1));
  const sc=Math.min(1,3200/Math.max(W,H));W=Math.max(10,Math.round(W*sc));H=Math.max(10,Math.round(H*sc));
  const sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let a,b,c,d,e,f,g=0,h=0;
  if(Math.abs(sx)<1e-6&&Math.abs(sy)<1e-6){a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0}
  else{const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den;
    a=x1-x0+g*x1;b=x3-x0+h*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0}
  const sw=src.width,shh=src.height,sd=src.getContext("2d",{willReadFrequently:true}).getImageData(0,0,sw,shh).data;
  const out=document.createElement("canvas");out.width=W;out.height=H;const oc=out.getContext("2d");const od=oc.createImageData(W,H),o=od.data;
  for(let j=0;j<H;j++){const v=j/(H-1);for(let i=0;i<W;i++){const u=i/(W-1),den=g*u+h*v+1;
    let X=(a*u+b*v+c)/den,Y=(d*u+e*v+f)/den;if(X<0)X=0;if(Y<0)Y=0;if(X>sw-1.001)X=sw-1.001;if(Y>shh-1.001)Y=shh-1.001;
    const xi=X|0,yi=Y|0,fx=X-xi,fy=Y-yi,p=(yi*sw+xi)*4,q=p+sw*4,t=(j*W+i)*4;
    for(let ch=0;ch<3;ch++){o[t+ch]=(sd[p+ch]*(1-fx)+sd[p+4+ch]*fx)*(1-fy)+(sd[q+ch]*(1-fx)+sd[q+4+ch]*fx)*fy}o[t+3]=255}}

// Scan-Look: Graustufen, Licht ausgleichen, Papier weiß, Schrift kräftig
function enhanceScan(cv){

const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
async function docText(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name||"")){
    await loadLib(PDFJS,()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let text="";const pages=Math.min(pdf.numPages,6);
    for(let p=1;p<=pages;p++){
      const page=await pdf.getPage(p);const tc=await page.getTextContent();
      // Textstücke zu Zeilen zusammensetzen (gleiche Höhe)
      const rows=new Map();for(const it of tc.items){const y=Math.round(it.transform[5]);const r=rows.get(y)||[];r.push([it.transform[4],it.str]);rows.set(y,r)}

      if(pt.replace(/\s/g,"").length<40){ // gescanntes PDF: Seite als Bild lesen
        const vp=page.getViewport({scale:2.2});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;

}
const PSTOP=new Set(["dr","med","prof","dipl","gmbh","ggmbh","mbh","mvz","co","kg","ag","ug","und","der","die","das","fuer","für","praxis","gemeinschaftspraxis","zentrum","ohg","gbr"]);

      // Erstattung steht in derselben Zeile hinter dem Rechnungsbetrag; gleicher Betrag dahinter = abgelehnt
      const l=lines[li],m=l.match(re),rest=l.slice(m.index+m[0].length);const nums=[...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(x=>r2(x[1].replace(/\./g,"").replace(",",".")));
      if(nums.length)refund=Math.abs(nums[0]-a)<0.005?0:nums[nums.length-1];
      else{ // Betrag steht allein (z. B. stationär): Summenzeile "Betrag Erstattung" in den nächsten Zeilen suchen
        for(let j=li+1;j<Math.min(lines.length,li+8);j++){const mm=lines[j].trim().match(new RegExp("^"+re.source+"\\s+(\\d{1,3}(?:\\.\\d{3})*,\\d{2})"));if(mm){refund=r2(mm[1].replace(/\./g,"").replace(",","."));break}}}}
    if(inv.invoiceDate){const [y,m,d]=inv.invoiceDate.split("-");if(text.includes(`${d}.${m}.${y}`)||text.includes(`${d}.${m}.${y.slice(2)}`))score+=2}
    const pw=provWords(inv.provider);if(pw.some(w=>tw.has(w)))score+=1;
    if(inv.patient&&low.includes(inv.patient.toLowerCase()))score+=0.5;
    if(score>=2)cands.push({id:inv.id,score,refund,amount:a,amt:li>=0});
  }
  // Betrag allein reicht, wenn er nur bei einer offenen Rechnung vorkommt (AXA nennt kein Rechnungsdatum)
  return cands.filter(c=>c.score>=3||(c.amt&&cands.filter(o=>o.amt&&o.amount===c.amount).length===1)).sort((a,b)=>b.score-a.score);
}

async function openProof(input,pre){

function fillProofRows(){const k=S.edit.k;
  S.edit.rows=matchInvoices(S.edit.text||"",k).map(m=>{const inv=S.inv.find(x=>x.id===m.id);const s=side(inv,k);return {id:m.id,on:m.refund!==0,rejected:m.refund===0,amount:m.refund!=null?m.refund:s.state==="done"?s.received:s.expected}});
  const pid=S.edit.pre?.id;if(pid&&!S.edit.rows.some(r=>r.id===pid)){const inv=S.inv.find(x=>x.id===pid);if(inv){const s=side(inv,k);S.edit.rows.unshift({id:pid,on:true,amount:s.state==="done"?s.received:s.expected})}}}
function drawProof(){
  const e=S.edit,k=e.k;
  const rows=e.rows.map((r,i)=>{const inv=S.inv.find(x=>x.id===r.id);if(!inv)return "";const s=side(inv,k);
    return `<div class="prow"><label class="pchk"><input type="checkbox" data-row="${i}" ${r.on?"checked":""}><span><b>${esc(inv.provider)}</b><br><span class="status">${esc(inv.patient)} · ${dfmt(inv.invoiceDate)} · ${eur(inv.amount)} · erwartet ${eur(s.expected)}</span>${r.rejected?`<br><span style="color:var(--bad);font-size:12.5px">Im Nachweis abgelehnt (0 €) – nur auswählen, wenn das endgültig ist</span>`:""}</span></label>
      <label class="f">Erstattet (€)<input class="num" inputmode="decimal" data-amt="${i}" value="${String(r.amount.toFixed(2)).replace(".",",")}"></label></div>`}).join("");
  const used=new Set(e.rows.map(r=>r.id));

  const sum=r2(e.rows.filter(r=>r.on).reduce((a,r)=>a+(+r.amount||0),0));
  const cmp=e.total==null?"":(Math.abs(sum-e.total)<0.01?`<span style="color:var(--ok);font-weight:600">passt zum Nachweis</span>`:`<span style="color:var(--warn);font-weight:600">Nachweis: ${eur(e.total)}, Differenz ${eur(r2(e.total-sum))}</span>`);
  sheet("Leistungsnachweis",`
    <div id="edStatus" class="status" style="margin-top:10px">${esc(e.msg||"")}</div>
    <div class="sec">
      <div class="btnrow"><button type="button" class="btn ${k==="pkv"?"primary":""}" data-act="pside" data-k="pkv">PKV (AXA)</button><button type="button" class="btn ${k==="bh"?"primary":""}" data-act="pside" data-k="bh">Beihilfe</button></div>

      ${others.length?`<label class="f">Weitere Rechnung zuordnen<select id="addRow"><option value="">– auswählen –</option>${others.map(x=>`<option value="${esc(x.id)}">${esc(x.provider)} · ${esc(x.patient)} · ${dfmt(x.invoiceDate)} · ${eur(x.amount)}</option>`).join("")}</select></label>`:""}
      <div class="calc"><span>Summe erstattet</span><span><span class="num">${eur(sum)}</span> ${cmp}</span></div></div>`}
  `,`<button type="button" class="btn" data-act="pcancel">Abbrechen</button><button type="button" class="btn primary" data-act="papply" ${e.busy?"disabled":""}>Übernehmen</button>`);

function readAuthRedirect(){
  if(!location.hash||!/access_token=|error=/.test(location.hash))return null;

  history.replaceState(null,"",location.pathname+location.search);

  if(h.get("error")){glog("Google meldet: "+h.get("error"));return {error:h.get("error"),silent:!!saved?.silent}}
  if(saved&&h.get("state")!==saved.state){glog("Rückkehr mit falscher Kennung");return {error:"state"}}
  glog("Rückkehr von Google: Zugang erhalten"+(saved?"":" (ohne gespeicherte Kennung)"));
  return {token:h.get("access_token"),expires:+h.get("expires_in")||3600};
}

    if(id){s.driveDataId=id;changed=true}
  }
  if(changed)await dbPut("meta",{key:"settings",...s});
}
async function ensurePath(parts){
  const s=S.settings;s.driveFolderMap=s.driveFolderMap||{};
  let parent=s.driveFolderId,key="";
  for(const p of parts){key+="/"+p;
    if(!s.driveFolderMap[key]){s.driveFolderMap[key]=await findOrCreateFolder(p,parent);await dbPut("meta",{key:"settings",...s})}
    parent=s.driveFolderMap[key];}
  return parent;
}
const cleanName=s=>String(s||"").replace(/[\\/:*?"<>|#%]+/g," ").replace(/\s+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"").slice(0,60);
function ymParts(inv){const d=inv.invoiceDate||today();const m=+d.slice(5,7)||1;return [d.slice(0,4),String(m).padStart(2,"0")+" "+MONTHS[m-1]]}
function wantedName(inv,k){
  if(k!=="doc"&&inv[k]?.proofShared)return `${inv[k].proofDate||today()}_${k==="pkv"?"PKV":"Beihilfe"}_Leistungsnachweis.pdf`;
  const base=`${inv.invoiceDate||today()}_${cleanName(inv.patient)}_${cleanName(inv.provider||"Rechnung")}`;
  return k==="doc"?`${base}_${r2(inv.amount).toFixed(2).replace(".",",")}.pdf`:`${base}_${k==="pkv"?"PKV":"Beihilfe"}.pdf`;
}
async function wantedFolder(inv,k){
  if(k==="doc"){const c=calc(inv);
    if(c.pkv.state==="todo")return ensurePath(["Zum Einreichen","AXA",cleanName(inv.patient||"Ohne Person")]);
    if(c.bh.state==="todo")return ensurePath(["Zum Einreichen","Beihilfe"]);}
  if(k!=="doc"&&inv[k]?.proofShared)return ensurePath(["Leistungsnachweise",...ymParts({invoiceDate:inv[k].proofDate})]);
  return ensurePath([k==="doc"?"Rechnungen":"Leistungsnachweise",...ymParts(inv)]);
}
/* Foto -> PDF (eine A4-Seite), damit Beihilfe- und AXA-App die Datei auswählen können */
async function toPdf(blob){
  if(blob.type==="application/pdf")return blob;
  const bmp=await createImageBitmap(blob);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(bmp,0,0,w,h);
  const jpg=new Uint8Array(await (await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85))).arrayBuffer());
  return jpegToPdf(jpg,w,h);
}
function jpegToPdf(jpg,w,h){return jpegsToPdf([{jpg,w,h}])}
function jpegsToPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let pos=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);pos+=b.length};
  const pw=595.28,ph=841.89,n=pages.length;
  push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  const obj=(i,body)=>{off[i]=pos;push(`${i} 0 obj\n${body}\nendobj\n`)};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] /Count ${n} >>`);
  pages.forEach((p,i)=>{
    const po=3+i*3,io=po+1,co=po+2;
    const s=Math.min(pw/p.w,ph/p.h),dw=+(p.w*s).toFixed(2),dh=+(p.h*s).toFixed(2),x=+((pw-dw)/2).toFixed(2),y=+((ph-dh)/2).toFixed(2);
    const content=`q ${dw} 0 0 ${dh} ${x} ${y} cm /Im0 Do Q`;
    obj(po,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>`);
    off[io]=pos;push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /${p.gray?"DeviceGray":"DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);push(p.jpg);push("\nendstream\nendobj\n");
    obj(co,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });
  const total=3+n*3,xref=pos;let t=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  push(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
async function uploadMultipart(meta,blob,fileId){
  const b="b"+uid();
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||"application/octet-stream"}\r\n\r\n`,blob,`\r\n--${b}--`]);
  const url=fileId?`${UPLOAD}/${fileId}?uploadType=multipart&fields=id,webViewLink`:`${UPLOAD}?uploadType=multipart&fields=id,webViewLink`;
  return (await gfetch(url,{method:fileId?"PATCH":"POST",headers:{"Content-Type":`multipart/related; boundary=${b}`},body})).json();
}
// Anhänge: Rechnung + Leistungsnachweis PKV/Beihilfe
const SLOTS=["doc","pkv","bh"];
function slot(inv,k){const o=k==="doc"?inv:(inv[k]=inv[k]||{});const p=k==="doc"?"doc":"proof";
  const prop=n=>({get(){return o[p+n]},set(v){o[p+n]=v},enumerable:true});
  return Object.defineProperties({},{fileId:prop("FileId"),driveId:prop("DriveId"),url:prop("Url"),folder:prop("Folder"),name:prop("Name")})}
function stripLocal(inv){const c=structuredClone(inv);delete c.docFileId;delete c.thumbFileId;if(c.pkv)delete c.pkv.proofFileId;if(c.bh)delete c.bh.proofFileId;return c}
function scheduleSync(){if(!S.settings.driveLinked)return;G.dirty=true;updateChip();clearTimeout(G.timer);G.timer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!S.settings.driveLinked)return;
  if(!tokenValid()){G.dirty=true;updateChip();return}
  if(G.busy){G.dirty=true;return}
  G.busy=true;G.dirty=false;G.err=null;updateChip();
  try{
    await ensureFolders();
    for(const pp of S.settings.people||[])if(pp.name)await ensurePath(["Zum Einreichen","AXA",cleanName(pp.name)]);
    let remote=null;
    if(S.settings.driveDataId){
      try{remote=await (await gfetch(`${API}/${S.settings.driveDataId}?alt=media`)).json()}
      catch(e){if(e.code==="auth")throw e;S.settings.driveDataId=null;await ensureFolders()}
    }
    // Löschungen zusammenführen
    for(const [id,t] of Object.entries(remote?.deleted||{}))if(!S.deleted[id]||S.deleted[id]<t)S.deleted[id]=t;
    // Rechnungen zusammenführen: neuere Änderung gewinnt, lokale Dateien bleiben erhalten
    const map=new Map(S.inv.map(i=>[i.id,i]));
    for(const r of remote?.invoices||[]){
      const l=map.get(r.id);
      if(!l||(r.updatedAt||"")>(l.updatedAt||"")){
        const m=structuredClone(r);
        if(l)for(const k of SLOTS){const ls=slot(l,k),ms=slot(m,k);if(ls.fileId&&(!ms.driveId||ms.driveId===ls.driveId))ms.fileId=ls.fileId}
        map.set(r.id,m);
      }
    }
    for(const [id,t] of Object.entries(S.deleted)){const i=map.get(id);if(i&&t>=(i.updatedAt||""))map.delete(id)}
    // Belege als PDF hochladen bzw. in den richtigen Ordner verschieben und benennen
    // Ein Leistungsnachweis kann zu mehreren Rechnungen gehören: nur einmal hochladen
    const uploaded=new Map();
    for(const inv of map.values())for(const k of SLOTS){const s=slot(inv,k);if(s.fileId&&s.driveId)uploaded.set(s.fileId,{id:s.driveId,url:s.url,folder:s.folder,name:s.name})}
    for(const inv of map.values())for(const k of SLOTS){const s=slot(inv,k);const u=s.fileId&&!s.driveId&&uploaded.get(s.fileId);
      if(u){s.driveId=u.id;s.url=u.url;s.folder=u.folder;s.name=u.name;inv.updatedAt=new Date().toISOString()}}
    for(const inv of map.values()){
      for(const k of SLOTS){const s=slot(inv,k);
        if(k!=="doc"&&!(+inv[k]?.rate>0)&&!s.fileId&&!s.driveId)continue;
        if(s.fileId&&!s.driveId){
          const f=await dbGet("files",s.fileId);if(!f)continue;
          const target=await wantedFolder(inv,k),name=wantedName(inv,k);
          const up=await uploadMultipart({name,parents:[target]},await toPdf(f.blob));
          s.driveId=up.id;s.url=up.webViewLink||`https://drive.google.com/file/d/${up.id}/view`;s.folder=target;s.name=name;
          uploaded.set(s.fileId,{id:s.driveId,url:s.url,folder:target,name});
          for(const o of map.values())for(const k2 of SLOTS){const so=slot(o,k2);if(so.fileId===s.fileId&&!so.driveId){so.driveId=s.driveId;so.url=s.url;so.folder=target;so.name=name;o.updatedAt=inv.updatedAt=new Date().toISOString()}}
          inv.updatedAt=new Date().toISOString();glog("Hochgeladen: "+name);
        }else if(s.driveId){
          const target=await wantedFolder(inv,k),name=wantedName(inv,k);
          if(s.folder!==target||s.name!==name){
            try{await moveFile(s.driveId,target,name);s.folder=target;s.name=name;inv.updatedAt=new Date().toISOString()}
            catch(e){if(e.code==="auth")throw e;glog("Verschieben nicht möglich: "+(s.name||s.driveId))}
          }
        }
      }
      // Muss die Rechnung zu AXA und Beihilfe, liegt eine Kopie zusätzlich im Ordner „Beihilfe“
      const c=calc(inv);
      if(c.pkv.state==="todo"&&c.bh.state==="todo"&&inv.docDriveId){
        const t=await ensurePath(["Zum Einreichen","Beihilfe"]),nm=wantedName(inv,"doc");
        if(!inv.docCopyId){
          try{const cp=await (await gfetch(`${API}/${inv.docDriveId}/copy?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:nm,parents:[t]})})).json();
            inv.docCopyId=cp.id;inv.docCopyName=nm;inv.updatedAt=new Date().toISOString();glog("Kopie für Beihilfe: "+nm)}
          catch(e){if(e.code==="auth")throw e;glog("Kopie nicht möglich: "+nm)}
        }else if(inv.docCopyName!==nm){
          try{await moveFile(inv.docCopyId,t,nm);inv.docCopyName=nm;inv.updatedAt=new Date().toISOString()}catch(e){if(e.code==="auth")throw e}
        }
      }else if(inv.docCopyId){
        await trashDrive(inv.docCopyId);inv.docCopyId=null;inv.docCopyName=null;inv.updatedAt=new Date().toISOString();
      }
    }
    // Dateien gelöschter Rechnungen in den Papierkorb
    if(S.trash?.length){for(const id of [...S.trash]){await trashDrive(id);S.trash=S.trash.filter(x=>x!==id)}await dbPut("meta",{key:"trash",items:S.trash})}
    // Einstellungen: neuere gewinnt
    if(remote?.settings&&(remote.settingsUpdatedAt||"")>(S.settings.updatedAt||"")){
      const keep=Object.fromEntries(LOCAL_KEYS.map(k=>[k,S.settings[k]]));
      S.settings={...DEFAULT_SETTINGS,...remote.settings,updatedAt:remote.settingsUpdatedAt,...keep};
    }
    // Lokal speichern
    const ids=new Set(map.keys());
    for(const old of S.inv)if(!ids.has(old.id))await dbDel("invoices",old.id);
    for(const inv of map.values())await dbPut("invoices",inv);
    S.inv=[...map.values()];
    await dbPut("meta",{key:"deleted",items:S.deleted});
    // Nach Drive schreiben
    const shared=Object.fromEntries(Object.entries(S.settings).filter(([k])=>!LOCAL_KEYS.includes(k)&&k!=="updatedAt"));
    const data={app:"arztrechnungen",version:2,updatedAt:new Date().toISOString(),settings:shared,settingsUpdatedAt:S.settings.updatedAt||null,
      invoices:S.inv.map(stripLocal),deleted:S.deleted};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const up=await uploadMultipart(S.settings.driveDataId?{}:{name:DATA_NAME,parents:[S.settings.driveAppId]},blob,S.settings.driveDataId);
    if(!S.settings.driveDataId)S.settings.driveDataId=up.id;
    await dbPut("meta",{key:"settings",...S.settings});
    G.last=new Date();glog("Abgleich erfolgreich ("+S.inv.length+" Rechnungen)");
  }catch(e){G.err=e.code==="auth"?"auth":"fail";G.dirty=true;glog("Abgleich fehlgeschlagen: "+(e?.message||e))}
  finally{G.busy=false;updateChip();render()}
  if(G.dirty&&!G.err)scheduleSync();
}
// Kein Knopf oben: nur ein Punkt an "Einstellungen", wenn Änderungen noch nicht in Drive liegen
function driveStatus(){
  if(!S.settings.driveLinked)return {text:"Nicht verbunden.",pending:false};
  if(G.busy)return {text:"Gleicht gerade ab …",pending:false};
  const pending=G.dirty||!!G.err;
  if(G.err==="auth"||(pending&&!tokenValid()))return {text:"Änderungen sind noch nicht in Drive. Tippe auf „Jetzt abgleichen“.",pending:true};
  if(G.err)return {text:"Der letzte Abgleich ist fehlgeschlagen. Tippe auf „Jetzt abgleichen“.",pending:true};
  if(pending)return {text:"Änderungen werden gleich abgeglichen.",pending:true};
  if(G.last)return {text:"Alles in Drive gespeichert, zuletzt um "+G.last.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr.",pending:false};
  return {text:"Verbunden.",pending:false};
}
function updateChip(){
  try{if(G.dirty)localStorage.setItem("gdirty","1");else localStorage.removeItem("gdirty")}catch{}
  const st=driveStatus();$("#settingsDot").hidden=!st.pending;
  const el=$("#driveStatus");if(el)el.textContent=st.text;
}
try{if(localStorage.getItem("gdirty")==="1")G.dirty=true}catch{}
async function driveBlob(driveId){if(!tokenValid()||!driveId)return null;try{return await (await gfetch(`${API}/${driveId}?alt=media`)).blob()}catch{return null}}

/* ================= Start ================= */
(async()=>{
  render();
  try{
    const st=await dbGet("meta","settings");if(st){const {key,...rest}=st;S.settings={...DEFAULT_SETTINGS,...rest}}
    S.inv=await dbAll("invoices");
    const del=await dbGet("meta","deleted");S.deleted=del?.items||{};
    const tq=await dbGet("meta","trash");S.trash=tq?.items||[];
  }catch(err){$("#list").innerHTML=`<div class="empty">Speicher nicht verfügbar. Bitte die App nicht im privaten Modus öffnen.</div>`;return}
  S.loaded=true;render();updateChip();
  if(AUTH?.token&&!S.settings.driveLinked){S.settings.driveLinked=true;await dbPut("meta",{key:"settings",...S.settings});updateChip()}
  if(AUTH?.error){
    // stille Anmeldung nicht möglich -> normal mit Bestätigung anmelden
    if(AUTH.silent&&/interaction_required|login_required|consent_required/.test(AUTH.error))return connectDrive(false);
    toast(AUTH.error==="access_denied"?"Anmeldung abgebrochen":"Anmeldung bei Google fehlgeschlagen ("+AUTH.error+")");
  }
  if(AUTH?.token){toast("Mit Google Drive verbunden");glog("Verbunden in "+(matchMedia("(display-mode: standalone)").matches?"App":"Browser"))}
  if(S.settings.driveLinked&&tokenValid())syncNow();
  // Falls die Google-Anmeldung in einem anderen Fenster zurückkam: beim Zurückwechseln Zugang übernehmen
  document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState!=="visible")return;
    try{const t=JSON.parse(localStorage.getItem("gtok")||"null");if(t&&t.exp>Date.now()&&t.token!==G.token){G.token=t.token;G.exp=t.exp;glog("Zugang aus anderem Fenster übernommen")}}catch{}
    try{const st=await dbGet("meta","settings");if(st?.driveLinked&&!S.settings.driveLinked){const {key,...rest}=st;S.settings={...DEFAULT_SETTINGS,...rest}}}catch{}
    if(tokenValid()&&!S.settings.driveLinked){S.settings.driveLinked=true;await dbPut("meta",{key:"settings",...S.settings})}
    updateChip();render();
    if(S.settings.driveLinked&&tokenValid()&&(G.dirty||!G.last||Date.now()-G.last>60000))syncNow();
  });
  try{await navigator.storage?.persist?.()}catch{}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
(()=>{const q=$("#q"),c=$("#qClear");let t;
q.addEventListener("input",()=>{c.hidden=!q.value;clearTimeout(t);t=setTimeout(()=>{S.q=q.value;if(S.q)S.select=null;render()},150)});
c.addEventListener("click",()=>{q.value="";c.hidden=true;S.q="";render();q.focus()});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){c.click()}else if(e.key==="Enter")q.blur()});})();
</script>
